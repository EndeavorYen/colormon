<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>顏色寶可夢探險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one screen at a time, like a handheld game — camera → scan → encounter → result, dex on the side */
:root{
  --bg:#EAF1F8; --card:#FFFFFF; --ink:#18202E; --muted:#5B6678; --line:#D3DDE9;
  --sun:#FFC53D; --sunInk:#3A2A00; --good:#2E9E5B; --bad:#D9534F;
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --type:#9AA0A6; --main:#9AA0A6; --accent:#cccccc; --glyph:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111723; --card:#1A2232; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C374B;
  --sun:#FFC53D; --sunInk:#2A1E00; --good:#4CC27E; --bad:#F07A75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111723; --card:#1A2232; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C374B;
  --sun:#FFC53D; --sunInk:#2A1E00; --good:#4CC27E; --bad:#F07A75; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 20px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--sun);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.bar h1{font-family:var(--display);font-weight:900;font-size:1.3rem;margin:0;flex:1;line-height:1.2}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.dex-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.dex-btn b{font-family:var(--display);font-variant-numeric:tabular-nums}

.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:14px;font-weight:900;font-size:1.05rem;border:0;position:relative;cursor:pointer;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--sunInk)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* camera screen */
.viewer{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;max-height:60vh;border-radius:20px;overflow:hidden;background:#0d1117;display:grid;place-items:center}
.viewer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;width:56%;aspect-ratio:1;border:3px dashed rgba(255,255,255,.85);border-radius:50%;pointer-events:none}
.live-chip{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-size:.9rem;font-weight:700}
.live-chip i{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid #fff;background:#888}
.cam-off{position:relative;color:#cfd6e2;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cam-off p{margin:0;font-size:.92rem}
.shutter{width:78px;height:78px;border-radius:50%;border:6px solid var(--ink);background:var(--sun);align-self:center;box-shadow:0 0 0 4px var(--bg) inset}
.shutter:active{transform:scale(.94)}
.note{font-size:.84rem;color:var(--muted);margin:0;text-align:center}
.samples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.samples span{font-size:.84rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.86rem}

/* explore mode */
.explore-btn{background:color-mix(in srgb,var(--good) 18%,var(--card));color:var(--ink);border:2px solid var(--good)}
.ex-view{touch-action:none;--glowc:#5aa8ff}
.ex-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ex-glow{position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:.15;z-index:2;
  box-shadow:inset 0 0 calc(18px + 70px*var(--warm,0)) calc(4px + 22px*var(--warm,0)) var(--glowc)}
.ex-arrow{position:absolute;top:50%;width:56px;height:56px;margin-top:-28px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:3;animation:nudge 1s ease-in-out infinite}
.ex-arrow svg{width:34px;height:34px;fill:#fff}
.ex-arrow.left{left:12px;--dir:-1} .ex-arrow.right{right:12px;--dir:1}
.ex-arrow.up{top:14px;left:50%;margin:0 0 0 -28px;animation-name:nudgeV;--dir:-1} .ex-arrow.down{top:auto;bottom:62px;left:50%;margin:0 0 0 -28px;animation-name:nudgeV;--dir:1}
@keyframes nudge{50%{transform:translateX(calc(8px*var(--dir)))}}
@keyframes nudgeV{50%{transform:translateY(calc(8px*var(--dir)))}}
.ex-walk{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:6px;background:#ffd54a;color:#3a2a00;font-weight:900;border-radius:999px;padding:6px 14px;animation:walkpulse .8s ease-in-out infinite}
.ex-walk svg{width:22px;height:22px;fill:currentColor}
@keyframes walkpulse{50%{transform:translateX(-50%) scale(1.08)}}
.ex-steps{position:absolute;right:12px;top:12px;z-index:3;background:rgba(0,0,0,.5);color:#fff;font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px}
.ex-steps:empty{display:none}
.ex-step-btn{position:absolute;right:12px;bottom:58px;z-index:4;padding:10px 14px;font-size:.9rem}
.ex-reticle{z-index:3;transition:border-color .2s,transform .2s}
.ex-reticle.hot{border-color:#ffd54a;transform:scale(1.08)}
.ex-chip{z-index:3}
.ex-start{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#e9eef6;background:radial-gradient(circle at 50% 40%,#22314d,#0d1117 75%)}
.ex-start p{margin:0;max-width:34ch;font-size:.92rem}
.ex-start .ex-title{font-family:var(--display);font-weight:900;font-size:1.4rem;color:#fff}
.ex-start .ex-small{font-size:.8rem;color:#aab4c4}
.heat-row{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);font-weight:700}
.heat{flex:1;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.heat i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#5aa8ff,#ffd54a,#ff5a3c);transition:width .15s}
@media (prefers-reduced-motion:reduce){.ex-arrow,.ex-walk{animation:none}}

/* scan screen */
.scan-photo{position:relative;width:100%;max-width:100%;aspect-ratio:1;max-height:52vh;margin:0 auto;border-radius:20px;overflow:hidden;background:#000}
.scan-photo img{width:100%;height:100%;object-fit:cover;display:block}
.scan-photo::after{content:"";position:absolute;left:0;right:0;height:22%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent);animation:scan 1.1s linear infinite}
@keyframes scan{from{top:-22%}to{top:100%}}
.scan-text{text-align:center;font-weight:900;font-size:1.15rem;min-height:1.6em}
.palette{display:flex;height:30px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.palette i{display:block;height:100%;flex:0;transition:flex .6s ease-out}
.pal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pal-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:4px;border:1px solid var(--line)}

/* encounter scene */
.scene{position:relative;width:100%;height:min(54vh,460px);min-height:300px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--main) 35%,var(--card)),var(--card) 75%)}
.scene-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.2);opacity:.45}
.ground{position:absolute;left:18%;right:18%;top:68%;height:16%;border-radius:50%;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.mon{position:absolute;z-index:2;left:50%;top:40%;width:58%;max-width:230px;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.mon .glow{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 38%,rgba(255,255,255,0) 70%);opacity:0;pointer-events:none;z-index:1}
.mon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:filter .6s}
.mon .fb{width:72%;aspect-ratio:1;border-radius:50%;background:var(--main);box-shadow:0 0 0 10px var(--accent);display:grid;place-items:center;transition:filter .6s}
.mon .fb svg{width:46%;height:46%;fill:var(--glyph)}
.ball{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;will-change:transform;z-index:3}
.ball img{width:100%;height:100%;image-rendering:pixelated;display:block}
.ball .cap{position:absolute;inset:3px;border-radius:50%;background:var(--sun);border:4px solid var(--ink)}
.ball .cap::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.ball.has-img .cap{display:none}
.ball.locked img{filter:brightness(.75)}
.ball.locked .cap::after{background:var(--ink)}
.ball-shadow{position:absolute;left:0;top:0;width:44px;height:12px;margin:-6px 0 0 -22px;border-radius:50%;background:rgba(0,0,0,.25);z-index:2;opacity:0}
.hand{position:absolute;left:50%;top:auto;bottom:10px;margin-top:0;width:64px;height:64px;margin-left:-32px;z-index:3;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.flash{position:absolute;left:0;top:0;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 30%,transparent 70%);opacity:0;pointer-events:none;z-index:4}
.fx i{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);z-index:5}
.bubble{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:4px 16px;font-weight:900;white-space:nowrap;z-index:6;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.bubble:empty{display:none}
.shake-dots{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:6}
.shake-dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.shake-dots i.on{background:var(--sun);box-shadow:0 0 0 2px var(--ink)}

.info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info .name{font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1.1;margin:0}
.type-pill{background:var(--type);color:#fff;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.82rem}
.stars{color:#E8A100;letter-spacing:1px}
.orbs{margin-left:auto;display:flex;gap:6px}
.orbs b{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.orbs b.used{background:transparent;opacity:.3}
.orbs img{width:22px;height:22px;image-rendering:pixelated}
.orbs img.used{opacity:.25;filter:grayscale(1)}
.why{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.meter{width:100%;height:24px;border-radius:12px;background:var(--line);position:relative;overflow:hidden}
.meter .zone{position:absolute;left:62%;width:26%;top:0;bottom:0;background:color-mix(in srgb,var(--good) 55%,transparent)}
.meter .zone::after{content:"";position:absolute;left:46%;width:8%;top:0;bottom:0;background:var(--good)}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:5px;border-radius:3px;background:var(--ink);left:0}
.throw{touch-action:manipulation;user-select:none;-webkit-user-select:none;font-size:1.2rem;padding:18px}
.hw{font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.hw .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.hw.on .dot{background:var(--good)}
.throw:disabled{opacity:.45;cursor:default}

/* real-ball mode: live camera behind the scene */
.ar-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.scene.ar .scene-bg,.scene.ar .ground{display:none}
.scene.ar .mon{top:36%}
.ar-chip{position:absolute;left:10px;bottom:10px;z-index:6;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;max-width:calc(100% - 70px)}
.ball-mark{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:3px solid #4CC27E;border-radius:50%;z-index:5;pointer-events:none;transition:transform .06s linear}
.mode-btn{font-size:.92rem;padding:10px}
.throw-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.run-btn{padding:14px 18px}
.run-btn:disabled{opacity:.45;cursor:default}
.sens{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sens button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:6px 4px;font-weight:700;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:1px}
.sens button small{font-weight:400;font-size:.68rem;color:var(--muted)}
.sens button[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
.mode-btn[aria-pressed="true"]{border-color:var(--good);color:var(--good)}

.mon img,.mon .fb{transition:filter .8s ease}
.mon.silhouette img,.mon.silhouette .fb{filter:brightness(0) drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 0 10px rgba(255,255,255,.8))}
.why .dots b{font-weight:900;color:var(--muted)}
.setting{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);cursor:pointer}
.setting input{width:20px;height:20px;accent-color:var(--good);flex:none;margin-top:2px}
.dex div.seen img{filter:grayscale(1) opacity(.55)}
.dex div.seen span{color:var(--muted)}

/* result screen */
.result{align-items:center;text-align:center;justify-content:center}
.burst{position:relative;width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center}
.burst::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--main) 45%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.burst img,.burst .fb{position:relative;width:80%;height:80%;object-fit:contain;animation:popin .6s cubic-bezier(.3,1.6,.5,1)}
.burst .fb{width:60%;height:60%;border-radius:50%;background:var(--main);box-shadow:0 0 0 10px var(--accent);display:grid;place-items:center}
.burst .fb svg{width:46%;height:46%;fill:var(--glyph)}
@keyframes popin{from{transform:scale(.2)}}
.got{font-family:var(--display);font-weight:900;font-size:1.1rem;color:var(--good);margin:0}
.result .name{font-family:var(--display);font-weight:900;font-size:2.2rem;margin:0;line-height:1.1}
.result .sub{color:var(--muted);font-variant-numeric:tabular-nums}
.result .actions{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* dex screen */
.dex-head{display:flex;justify-content:space-between;align-items:baseline}
.dex-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:1.4rem}
.dex-head span{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.dex div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;position:relative}
.dex div img{width:64px;height:64px;image-rendering:pixelated}
.dex div .sw{width:40px;height:40px;border-radius:50%;margin:12px 0}
.dex div b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--muted);font-weight:600}
.dex div span{font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex div em{position:absolute;top:6px;right:8px;font-style:normal;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:32px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.hand{animation:none}.screen,.burst img,.burst .fb{animation:none}.burst::before,.scan-photo::after{animation:none}}
</style>

<div class="app">
  <div class="bar">
    <button class="icon-btn" id="backBtn" aria-label="回到拍照" hidden><svg viewBox="0 0 24 24"><path d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg></button>
    <h1 id="barTitle">顏色寶可夢探險</h1>
    <button class="icon-btn" id="muteBtn" aria-label="關閉音效" aria-pressed="false"><svg viewBox="0 0 24 24"><path id="muteIcon" d=""/></svg></button>
    <button class="dex-btn" id="dexBtn">圖鑑 <b id="dexCount">0</b></button>
  </div>

  <!-- 1 拍照 -->
  <section class="screen" id="s-camera">
    <div class="viewer" id="viewer">
      <video id="video" playsinline muted autoplay hidden></video>
      <div class="cam-off" id="camOff">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5L9 4zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        <p id="camMsg">對準身邊的東西，顏色最像哪隻寶可夢，牠就會出現</p>
        <button class="btn sun" id="liveBtn">打開相機</button>
      </div>
      <div class="reticle" id="reticle" hidden></div>
      <div class="live-chip" id="liveChip" hidden><i id="liveDot"></i><span id="liveText">對準中…</span></div>
    </div>
    <button class="shutter" id="shutter" aria-label="拍照" hidden></button>
    <button class="btn explore-btn" id="toExploreBtn">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 0 1 7.9 7H17a5 5 0 0 0-4-4V4.1L12 4zm-1 .1V7a5 5 0 0 0-4 4H4.1A8 8 0 0 1 11 4.1zM4.1 13H7a5 5 0 0 0 4 4v2.9A8 8 0 0 1 4.1 13zM13 19.9V17a5 5 0 0 0 4-4h2.9a8 8 0 0 1-6.9 6.9zM12 9a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/></svg>
      探索模式：跟著提示找寶可夢
    </button>
    <label class="btn ghost" for="photo">用手機相機拍一張 / 選照片
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <p class="note" id="ver"></p>
    <div class="samples"><span>範例：</span>

<script>
const BUILD="2026.10.27-1817";
/* =========================================================
   顏色寶可夢探險
   資料都在 data/：config.json 列出要載入的資料包（packs），
   types.json 定義屬性，packs/*.json 定義寶可夢。新增寶可夢只要加資料包。
   ========================================================= */
const DATA_BASE = "data/";
let CFG = null, TYPES = {}, MONS = [];

/* ---------- 硬體介面（之後接寶貝球） ----------
   寶貝球只需要回報兩件事，不判斷丟得好不好：
     window.onBallThrown()  偵測到被丟出去（出手 / 自由落體）
     window.onBallLanded()  偵測到落地（撞擊後靜止）
   Hardware.notifyEncounter(mon)：寶可夢出現時呼叫，可在這裡送出提醒指令      */
const Hardware = {
  connected: false,
  notifyEncounter(mon) {
    // TODO: 送指令給寶貝球，例如 ws.send(JSON.stringify({cmd:"alert", id:mon.id}))
    try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
  },
};
window.onBallThrown = () => throwBall();
window.onBallLanded = () => { landedResolve && landedResolve(); };

/* ---------- 色彩工具：sRGB → CIELAB ---------- */
function linTable(){return linTable.t||(linTable.t=Array.from({length:256},(_,i)=>{const c=i/255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}));}
function rgbLab(r,g,b){
  const L=linTable(),R=L[r],G=L[g],B=L[b];
  const x=(R*0.4124+G*0.3576+B*0.1805)/0.95047,y=R*0.2126+G*0.7152+B*0.0722,z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116, fy=f(y);
  return [116*fy-16,500*(f(x)-fy),200*(fy-f(z))];
}
function hexLab(h){const n=parseInt(h.slice(1),16);return rgbLab(n>>16,(n>>8)&255,n&255);}
const dE=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx];}
const HUE=[[15,"紅"],[40,"橘"],[68,"黃"],[95,"黃綠"],[160,"綠"],[195,"水藍"],[250,"藍"],[290,"紫"],[345,"粉紅"],[361,"紅"]];
function colorWord([r,g,b]){
  const [h,s,v]=rgb2hsv(r,g,b);
  if(v<0.2) return "黑色";
  if(s<0.15) return v>0.82?"白色":v<0.4?"深灰色":"灰色";
  if(h>=15&&h<50&&v<0.62) return "咖啡色";
  const name=HUE.find(([l])=>h<l)[1];
  return (v<0.42?"深":(s<0.42&&v>0.72?"淺":""))+name+"色";
}
const css=([r,g,b])=>`rgb(${r|0},${g|0},${b|0})`;
function fnv1a(str){let h=0x811c9dc5;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return h>>>0;}
function rng(seed){let a=seed;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function today(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}

/* ---------- 照片 → 主要色盤（中心加權 + Lab 空間 k-means） ---------- */
function palette(src,w,h){
  const N=48,cv=document.getElementById("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});
  const s=Math.min(w,h); ctx.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,N,N);
  const px=ctx.getImageData(0,0,N,N).data, P=[];
  for(let i=0;i<N*N;i++){
    const x=i%N,y=(i/N)|0,dist=Math.hypot(x-(N-1)/2,y-(N-1)/2)/(N*0.7);
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    P.push({lab:rgbLab(r,g,b),rgb:[r,g,b],w:1+2*Math.max(0,1-dist)});
  }
  const K=5,W=P.reduce((a,p)=>a+p.w,0);
  let C=[[0,1,2].map(k=>P.reduce((a,p)=>a+p.lab[k]*p.w,0)/W)];
  while(C.length<K){let best=null,bd=-1;for(const p of P){const d=Math.min(...C.map(c=>dE(c,p.lab)))*p.w;if(d>bd){bd=d;best=p;}}C.push(best.lab.slice());}
  let groups;
  for(let it=0;it<10;it++){
    groups=C.map(()=>({w:0,lab:[0,0,0],rgb:[0,0,0]}));
    for(const p of P){let bi=0,bd=1e9;C.forEach((c,i)=>{const d=dE(c,p.lab);if(d<bd){bd=d;bi=i;}});
      const g=groups[bi];g.w+=p.w;for(let k=0;k<3;k++){g.lab[k]+=p.lab[k]*p.w;g.rgb[k]+=p.rgb[k]*p.w;}}
    groups=groups.filter(g=>g.w>0);groups.forEach(g=>{for(let k=0;k<3;k++){g.lab[k]/=g.w;g.rgb[k]/=g.w;}});
    C=groups.map(g=>g.lab);
  }
  groups.sort((a,b)=>b.w-a.w);
  const out=[];
  for(const g of groups){const m=out.find(o=>dE(o.lab,g.lab)<10); if(m){m.w+=g.w;} else out.push(g);}
  return out.map(g=>({lab:g.lab,rgb:g.rgb,share:g.w/W,word:colorWord(g.rgb)})).filter((g,i)=>i===0||g.share>=0.04);
}

/* ---------- 色盤 → 寶可夢 ---------- */
/* 雙向比對：照片的顏色要在牠身上找得到，牠的顏色也要在照片裡找得到（主色最重要） */
function scoreMon(pal,mon){
  const top=pal.slice(0,3),tot=top.reduce((a,c)=>a+c.share,0);
  let photoToMon=0;
  for(const c of top) photoToMon+=(c.share/tot)*Math.min(...mon.labs.map(l=>dE(c.lab,l)));
  const mw=mon.labs.map((_,j)=>j===0?0.7:0.3/(mon.labs.length-1||1));
  let monToPhoto=0;
  mon.labs.forEach((l,j)=>{ monToPhoto+=mw[j]*Math.min(...top.map(c=>dE(c.lab,l))); });
  return 0.5*photoToMon+0.5*monToPhoto+0.25*dE(pal[0].lab,mon.labs[0]);
}
/* 照片顏色和每個屬性「代表色系」的距離（黑→幽靈/惡、木頭→地面/岩石/一般…） */
function typeDistances(pal){
  const top=pal.slice(0,3),tot=top.reduce((a,c)=>a+c.share,0),out={};
  for(const [k,t] of Object.entries(TYPES)){
    if(!t.affLabs) continue;
    let d=0; for(const c of top) d+=(c.share/tot)*Math.min(...t.affLabs.map(l=>dE(c.lab,l)));
    out[k]=d;
  }
  return out;
}
/* 在一群寶可夢裡依分數挑一隻（越像、越不稀有、沒抓過的越容易） */
function pickFrom(scored,pal,r){
  const dmin=scored[0].d, win=CFG.similarityWindow??10;
  let cands=scored.filter(c=>c.d<=dmin+win).slice(0,CFG.candidates||30);
  if(cands.length<(CFG.minCandidates??6)) cands=scored.slice(0,CFG.minCandidates??6);
  if(cands.filter(c=>!dex[c.m.id]).length<2){                  // 沒抓過的太少 → 放寬範圍找沒抓過的
    const extra=scored.filter(c=>!dex[c.m.id]&&!cands.includes(c)&&c.d<=dmin+win*(CFG.widenFactor??3)).slice(0,6);
    cands=[...cands,...extra];
  }
  const p0=pal[0].lab, vivid=Math.min(1,Math.hypot(p0[1],p0[2])/70);
  const rar={1:1,2:0.45,3:0.12+0.25*vivid};
  const temp=CFG.randomness??6, caughtW=CFG.caughtWeight??0.3;
  const ws=cands.map(c=>Math.exp(-(c.d-dmin)/temp)*(rar[c.m.rarity]??1)*(dex[c.m.id]?caughtW:1));
  let acc=0,tot=ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<cands.length;i++){acc+=ws[i]/tot;if(r<acc)return cands[i];}
  return cands[0];
}
function pickMon(pal){
  const seed=CFG.sameResultPerDay ? pal.slice(0,2).map(c=>c.lab.map(v=>Math.round(v/12)).join(",")).join("|")+"|"+today() : `${Date.now()}|${Math.random()}`;
  const rand=rng(fnv1a(seed));
  // 分數 = 寶可夢本身顏色的距離 和 屬性代表色系的距離 加權（越小越像）
  const lam=CFG.typeWeight??0.4, td=typeDistances(pal);
  const all=MONS.map(m=>{const c=scoreMon(pal,m);return {m,c,d:(1-lam)*c+lam*(td[m.type]??c)};});
  let pick;
  if(rand()<(CFG.colorOnlyChance??0.3)){
    // 只看顏色：顏色剛好很像的驚喜（紅色的球 → 霹靂電球）
    pick=pickFrom(all.map(x=>({m:x.m,d:x.c})).sort((a,b)=>a.d-b.d),pal,rand());
  }else{
    // 兩階段：先從顏色搭的幾個屬性抽一個，再在這個屬性裡挑
    const ts=Object.entries(td).sort((a,b)=>a[1]-b[1]), tmin=ts[0][1];
    const tc=ts.filter(([,d])=>d<=tmin+(CFG.typeWindow??14)).slice(0,CFG.maxTypes??4);
    const tw=tc.map(([,d])=>Math.exp(-(d-tmin)/(CFG.typeTemp??7)));
    let r=rand()*tw.reduce((a,b)=>a+b,0),type=tc[0][0];
    for(let i=0;i<tc.length;i++){r-=tw[i];if(r<=0){type=tc[i][0];break;}}
    const inType=all.filter(x=>x.m.type===type).sort((a,b)=>a.d-b.d);
    pick=pickFrom(inType.length?inType:all.sort((a,b)=>a.d-b.d),pal,rand());
  }
  const colorD=all.find(x=>x.m===pick.m).c;
  return {mon:pick.m, sim:Math.max(5,Math.min(99,Math.round(100-colorD*1.3)))};
}

/* ---------- 載入資料 ---------- */
async function loadData(){
  const get=async p=>{const r=await fetch(DATA_BASE+p,{cache:"no-cache"});if(!r.ok)throw new Error(p+" "+r.status);return r.json();};
  CFG=await get("config.json");
  TYPES=await get("types.json");
  for(const t of Object.values(TYPES)) if(t.affinity) t.affLabs=t.affinity.map(hexLab);
  const packs=await Promise.all(CFG.packs.map(get));
  const seen=new Map();
  for(const pack of packs) for(const raw of pack.pokemon){
    const m={...(seen.get(raw.id)||{}),...raw};          // 後面的資料包可以只覆蓋部分欄位（例如只改顏色）
    if(!m.name||!TYPES[m.type]||!m.colors?.length){console.warn("略過格式不正確的寶可夢",raw);continue;}
    seen.set(m.id,{...m,labs:m.colors.map(hexLab)});
  }
  MONS=[...seen.values()];
}
const artUrl=id=>CFG.artUrl.replace("{id}",id);
const spriteUrl=id=>CFG.spriteUrl.replace("{id}",id);

/* ---------- 畫面切換（用網址 # 記錄，手機返回鍵可用） ---------- */
const $=id=>document.getElementById(id);
const SCREENS=["camera","explore","scan","encounter","result","dex"];
const TITLES={camera:"顏色寶可夢探險",explore:"探索模式",scan:"分析顏色",encounter:"野生寶可夢",result:"抓到了",dex:"我的圖鑑"};
let screen="camera";
function go(name,replace){
  const h="#"+name;
  if(location.hash===h){show(name);return;}
  if(replace) history.replaceState(null,"",h); else history.pushState(null,"",h);
  show(name);
}
function show(name){
  if(!SCREENS.includes(name)) name="camera";
  if(name==="scan"&&!scanning) name="camera";
  if(name==="encounter"&&!current&&!fled) name="camera";
  if(name==="result"&&!lastCaught) name="camera";
  screen=name;
  SCREENS.forEach(s=>$("s-"+s).hidden=s!==name);
  $("barTitle").textContent=TITLES[name];
  $("backBtn").hidden=name==="camera";
  $("dexBtn").hidden=name==="dex";
  if(name==="camera") resumeCamera(); else pauseCamera();
  if(name==="explore") resumeExplore(); else pauseExplore(name);
  if(name==="camera"||name==="explore") home=name;           // 抓完、逃跑後回到哪裡
  $("moreBtn").textContent=home==="explore"?"繼續探險":"繼續拍照";
  if(name==="encounter"&&AR.on) startAR(); else if(name!=="encounter") stopAR();
  if(name==="dex") renderDex();
  scrollTo(0,0);
}
addEventListener("popstate",()=>show(location.hash.slice(1)));
let home="camera";
$("backBtn").onclick=()=>go(screen==="explore"?"camera":home);
$("dexBtn").onclick=()=>go("dex");
$("moreBtn").onclick=()=>go(home);
$("toDexBtn").onclick=()=>go("dex");
$("fledBtn").onclick=()=>go(home);

/* ---------- 1 拍照 ---------- */
let stream=null,camWanted=false,liveTimer=0;
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia||!isSecureContext){
    $("camMsg").textContent="這裡不能直接開相機（需要 https）。請用下面的按鈕拍照。";$("liveBtn").hidden=true;return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}},audio:false});
    const v=$("video");v.srcObject=stream;v.hidden=false;await v.play();
    camWanted=true;
    $("camOff").hidden=true;$("reticle").hidden=false;$("liveChip").hidden=false;$("shutter").hidden=false;
    clearInterval(liveTimer);liveTimer=setInterval(liveScan,450);
  }catch(err){
    $("camMsg").textContent="相機打不開（可能沒有給權限）。請用下面的按鈕拍照。";
  }
}
function pauseCamera(){
  clearInterval(liveTimer);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $("video").hidden=true;$("reticle").hidden=true;$("liveChip").hidden=true;$("shutter").hidden=true;$("camOff").hidden=false;
}
function resumeCamera(){ if(camWanted&&!stream) startCamera(); }
function liveScan(){
  const v=$("video");if(!v.videoWidth)return;

/* ---------- 2 分析顏色 ---------- */
let scanning=false;
function startScan(src){
  if(!MONS.length){toast("寶可夢資料還沒載入");return;}
  const img=new Image();
  img.onload=async()=>{
    scanning=true;
    const pal=palette(img,img.naturalWidth,img.naturalHeight);
    const picked=pickMon(pal);                                  // 先決定是誰，趁分析動畫時下載圖片
    const preload=new Promise(res=>{const im=new Image();im.onload=im.onerror=res;im.src=artUrl(picked.mon.id);});
    $("scanImg").src=src;$("sceneBg").style.backgroundImage=`url("${src}")`;
    $("scanText").textContent="分析顏色中…";
    $("palette").innerHTML=pal.map(c=>`<i style="background:${css(c.rgb)}"></i>`).join("");
    $("palLegend").innerHTML="";
    go("scan");
    await wait(450);
    [...$("palette").children].forEach((el,i)=>el.style.flex=pal[i].share);
    $("palLegend").innerHTML=pal.map(c=>`<span style="--c:${css(c.rgb)}">${c.word} ${Math.round(c.share*100)}%</span>`).join("");
    const words=pal.slice(0,2).map(c=>c.word).filter((w,i,a)=>a.indexOf(w)===i);
    await wait(600); $("scanText").textContent=`看到${words.join(" + ")}！`;
    await wait(900); $("scanText").textContent="草叢裡有東西在動…";
    await Promise.race([preload,wait(800)]);
    scanning=false;
    startEncounter(pal,picked);
  };
  img.onerror=()=>toast("這張照片打不開，換一張試試");
  img.src=src;
}

/* ---------- 3 遭遇 ---------- */
let current=null,fled=false,misses=0,busy=false,lastCaught=null,encounterId=0;
function setMonVisual(mon,{imgEl,fbEl,glyphEl}){
  const T=TYPES[mon.type], st=document.documentElement.style;
  st.setProperty("--type",T.color);st.setProperty("--main",mon.colors[0]);st.setProperty("--accent",mon.colors[1]||mon.colors[0]);
  st.setProperty("--glyph",mon.labs[0][0]>68?"#1d2330":"#ffffff");
  glyphEl.setAttribute("d",T.glyph);
  fbEl.hidden=false;imgEl.hidden=true;imgEl.alt=mon.name;
  imgEl.onload=()=>{imgEl.hidden=false;fbEl.hidden=true;};
  imgEl.onerror=()=>{imgEl.hidden=true;fbEl.hidden=false;};
  imgEl.src=artUrl(mon.id);
}
async function startEncounter(pal,picked){
  const {mon,sim}=picked, T=TYPES[mon.type];
  current=mon;fled=false;misses=0;busy=false;encounterId++;
  $("glow").getAnimations().forEach(a=>a.cancel());
  setMonVisual(mon,{imgEl:$("art"),fbEl:$("monFb"),glyphEl:$("glyph")});
  revealed=!silhouetteOn()||!!dex[mon.id];                 // 沒抓過的寶可夢先用剪影
  $("mon").classList.toggle("silhouette",!revealed);
  showMonInfo(mon,revealed);
  $("monStars").textContent="★".repeat(mon.rarity)+"☆".repeat(3-mon.rarity);
  $("whyPhoto").innerHTML=pal.slice(0,3).map(c=>`<i style="background:${css(c.rgb)}"></i>`).join("");
  $("sim").textContent=`相似 ${sim}%`;
  $("throwArea").hidden=false;$("fledBtn").hidden=true;$("throwBtn").disabled=true;$("runBtn").disabled=false;
  const ball=$("ball");ball.getAnimations().forEach(a=>a.cancel());ball.hidden=true;ball.classList.remove("locked");
  $("hand").hidden=false;$("shakeDots").hidden=true;
  const m=$("mon");m.getAnimations().forEach(a=>a.cancel());m.style.opacity="";
  drawOrbs();bubble("！");
  go("encounter",true);
  // 從草叢跳出來
  await anim(m,[{transform:"translate(-50%,-10%) scale(.6)",opacity:0},{transform:"translate(-50%,-62%) scale(1.05)",opacity:1,offset:.6},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:550,easing:"ease-out"});
  shakeScene(5,300);
  bubble(revealed?`野生的${mon.name}出現了！`:"野生的寶可夢出現了！是誰呢？");sfx("appear");
  Hardware.notifyEncounter(mon);
  $("throwBtn").disabled=false;
}

/* ---------- 動畫小工具 ---------- */
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const T_=ms=>reduced?Math.round(ms*0.35):ms;
const wait=ms=>new Promise(r=>setTimeout(r,T_(ms)));
function anim(el,frames,opt){const a=el.animate(frames,{fill:"forwards",...opt,duration:T_(opt.duration)});return a.finished.catch(()=>{});}
function pts(){
  const s=$("scene").getBoundingClientRect(), m=$("mon").getBoundingClientRect();
  const mon={x:m.left-s.left+m.width/2,y:m.top-s.top+m.height/2};
  return {hand:{x:s.width/2,y:s.height-42},mon,ground:{x:mon.x,y:s.height*0.76}};
}
const at=(p,extra="")=>`translate(${p.x}px,${p.y}px) ${extra}`;
function stars(p,n=10){
  const fx=$("fx");
  for(let i=0;i<n;i++){
    const s=document.createElement("i"),a=i/n*Math.PI*2,r=70+Math.random()*30;
    fx.appendChild(s);
    anim(s,[{transform:at(p,"scale(.3)"),opacity:1},{transform:at({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r},"scale(1) rotate(90deg)"),opacity:0}],{duration:800,easing:"ease-out"}).then(()=>s.remove());
  }
}
function shakeScene(px=6,ms=350){
  const k=[0,-1,1,-.7,.7,-.3,0].map(f=>({transform:`translate(${f*px}px,${Math.abs(f)*px*.4}px)`}));
  return anim($("scene"),k,{duration:ms,easing:"linear",fill:"none"});
}
function flash(p){const f=$("flash");return anim(f,[{transform:at(p,"scale(.2)"),opacity:1},{transform:at(p,"scale(1.4)"),opacity:0}],{duration:450,easing:"ease-out"});}

/* ---------- 投擲與捕捉 ----------
   onBallThrown → 球飛出、寶可夢被吸進去 → 等 onBallLanded → 落地、晃動、結果
   抓到的機率只看稀有度（config.catchBase），不看丟得好不好                          */
let landedResolve=null;
async function throwBall(){
  if(!current||busy||screen!=="encounter")return;
  busy=true;$("throwBtn").disabled=true;$("runBtn").disabled=true;
  const myId=encounterId, stale=()=>myId!==encounterId;      // 換了新的寶可夢，舊動畫就停
  const landed=new Promise(r=>landedResolve=r);
  const mon=current, ball=$("ball"), monEl=$("mon"), sh=$("ballShadow"), P=pts();
  // 不限次數；每失敗一次捕捉率提高，失敗 guaranteeAfter 次後一定抓到
  const guarantee=CFG.guaranteeAfter??4;
  const p=misses>=guarantee?1:Math.min(0.95,(CFG.catchBase[mon.rarity]??0.5)+misses*(CFG.catchBonusPerMiss??0.15));
  const q=Math.cbrt(p);                                       // 每晃一下撐住的機率，三下都撐住就抓到
  let shakes=0; while(shakes<3&&Math.random()<q) shakes++;
  const caught=shakes===3;

  bubble("去吧，寶貝球！");
  // 1. 拋物線飛向寶可夢
  $("hand").hidden=true;ball.hidden=false;ball.classList.remove("locked");
  const top={x:(P.hand.x+P.mon.x)/2,y:Math.min(P.hand.y,P.mon.y)-110};
  await anim(ball,[{transform:at(P.hand,"rotate(0) scale(1.25)")},{transform:at(top,"rotate(400deg) scale(1)"),offset:.55},{transform:at(P.mon,"rotate(760deg) scale(.95)")}],{duration:650,easing:"cubic-bezier(.3,.6,.6,1)"});if(stale())return;
  // 2. 打中：球彈開一點、閃光、畫面晃一下，寶可夢變成光被吸進球裡
  flash(P.mon);shakeScene(7,320);sfx("hit");
  const up={x:P.mon.x,y:P.mon.y-40};
  anim(ball,[{transform:at(P.mon,"rotate(0)")},{transform:at(up,"rotate(-25deg)")}],{duration:300,easing:"ease-out"});
  anim($("glow"),[{opacity:0},{opacity:1,offset:.35},{opacity:0}],{duration:520,fill:"none"});
  await anim(monEl,[{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:"translate(-50%,-50%) scale(1.05)",opacity:1,offset:.35},{transform:`translate(-50%,calc(-50% - 40px)) scale(0)`,opacity:0}],{duration:520,easing:"ease-in"});if(stale())return;
  anim(ball,[{transform:at(up,"rotate(-25deg)")},{transform:at(up,"rotate(15deg)")},{transform:at(up,"rotate(0)")}],{duration:300});
  // 3. 等寶貝球回報落地（模擬模式會自動送出；最多等 4 秒）
  await Promise.race([landed,wait(CFG.ball?.landTimeoutMs||5000)]);landedResolve=null;if(stale())return;
  await anim(ball,[{transform:at(up)},{transform:at(P.ground,"scale(1.1,.9)"),offset:.5,easing:"ease-out"},{transform:at({x:P.ground.x,y:P.ground.y-30},"scale(1)"),offset:.72,easing:"ease-in"},{transform:at(P.ground,"scale(1.08,.92)"),offset:.9},{transform:at(P.ground)}],{duration:700,easing:"ease-in"});if(stale())return;
  anim(sh,[{transform:at({x:P.ground.x,y:P.ground.y+24}),opacity:0},{transform:at({x:P.ground.x,y:P.ground.y+24}),opacity:1}],{duration:200});
  shakeScene(5,260);
  // 4. 搖晃
  bubble("……");
  const dots=[...$("shakeDots").children];dots.forEach(d=>d.classList.remove("on"));$("shakeDots").hidden=false;
  await wait(600);if(stale())return;
  for(let i=0;i<shakes;i++){
    const deg=30-i*4;
    await anim(ball,[{transform:at(P.ground,"rotate(0)")},{transform:at({x:P.ground.x-5,y:P.ground.y},`rotate(${-deg}deg)`)},{transform:at({x:P.ground.x+4,y:P.ground.y},`rotate(${deg*0.75}deg)`)},{transform:at({x:P.ground.x-2,y:P.ground.y},`rotate(${-deg*0.3}deg)`)},{transform:at(P.ground,"rotate(0)")}],{duration:620,easing:"ease-in-out"});if(stale())return;
    shakeScene(2.5,200);sfx("shake");
    dots[i].classList.add("on");
    await wait(i===shakes-1&&caught?700:450);if(stale())return;
  }
  if(caught){
    // 5a. 喀擦！抓到了
    ball.classList.add("locked");
    shakeScene(8,420);stars(P.ground,14);sfx("caught");bubble(`喀擦！抓到${mon.name}了！`);
    try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}
    saveDex(mon);lastCaught=mon;current=null;
    await wait(1500);if(stale())return;
    anim(sh,[{opacity:1},{opacity:0}],{duration:200});
    showResult(mon);
  }else{
    // 5b. 球彈開，寶可夢跳出來
    await anim(ball,[{transform:at(P.ground,"rotate(0) scale(1)")},{transform:at(P.ground,"rotate(-8deg) scale(1.15,.85)"),offset:.4},{transform:at(P.ground,"rotate(0) scale(1.6)"),opacity:0}],{duration:320});if(stale())return;
    ball.hidden=true;ball.getAnimations().forEach(a=>a.cancel());
    anim(sh,[{opacity:1},{opacity:0}],{duration:150});
    flash(P.ground);shakeScene(9,380);sfx("escape");
    const dy=P.ground.y-P.mon.y;
    anim($("glow"),[{opacity:1},{opacity:.6,offset:.65},{opacity:0}],{duration:520,fill:"none"});
    await anim(monEl,[{transform:`translate(-50%,calc(-50% + ${dy}px)) scale(0)`,opacity:0},{transform:"translate(-50%,-62%) scale(1.12)",opacity:1,offset:.65},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:520,easing:"ease-out"});if(stale())return;
    $("shakeDots").hidden=true;
    if(!revealed){await revealMon(mon);if(stale())return;}
    markSeen(mon);
    misses++;
    bubble(shakes===0?`${mon.name}跳出來了！再丟一次！`:shakes===1?"啊！差一點點…再試一次！":"可惜！只差一點！再丟一次！");
    $("hand").hidden=false;
    $("throwBtn").disabled=false;$("runBtn").disabled=false;
  }
  busy=false;
}

/* ---------- 範例照片 ---------- */
function sample(kind){
  const c=document.createElement("canvas");c.width=c.height=240;const g=c.getContext("2d");
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const grad=st=>{const l=g.createLinearGradient(0,0,0,240);st.forEach((s,i)=>l.addColorStop(i/(st.length-1),s));g.fillStyle=l;g.fillRect(0,0,240,240);};
  const blobs=(n,col,r)=>{for(let i=0;i<n;i++){g.fillStyle=col;g.beginPath();g.arc(rnd()*240,rnd()*240,r*(0.5+rnd()),0,7);g.fill();}};
  if(kind==="grass"){grad(["#7DC95E","#3E9A37","#2C7A2A"]);blobs(18,"#F5E14A",4);}
  if(kind==="sky"){grad(["#3D8BE8","#6FB0F2","#A9D3FA"]);blobs(7,"rgba(255,255,255,.95)",24);}
  if(kind==="sunset"){grad(["#7A3E9D","#E2534A","#F79B3A"]);g.fillStyle="#FFD45A";g.beginPath();g.arc(120,170,38,0,7);g.fill();}
  if(kind==="banana"){grad(["#FBE7A1","#F2D36B"]);g.fillStyle="#F7C81E";g.beginPath();g.ellipse(120,120,95,45,-0.5,0,7);g.fill();}
  if(kind==="night"){grad(["#05070F","#121a33","#1d2440"]);blobs(30,"#F4F4F4",1.2);}
  return c.toDataURL();
}

let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2400);}

/* =========================================================
   真球模式：後鏡頭拍地板，偵測「有東西被丟進畫面」
   不認顏色、不認哪顆球：比較前後兩張畫面，找出一團「不太大、在移動」的變化。
     連續幾張都有這種移動        → onBallThrown
     畫面安靜下來一段時間        → onBallLanded
   整個畫面大範圍變動（手機被移動、燈光變化、人走過很近）會被忽略。
   ========================================================= */
class ThrowWatcher{
  constructor(o={}){
    this.o={diffThreshold:28,gradientWeight:0.6,maxShift:3,minPixels:4,maxFraction:0.15,maxSize:0.35,ignoreFraction:0.3,
            chromaWeight:0.8,edgeMargin:0.2,minDirCos:0.2,minStep:0.01,maxStep:0.3,confirmFrames:3,minTravel:0.08,stillMs:500,minFlightMs:300,maxFlightMs:4000,cooldownMs:800,warmupMs:1200,...o};
    this.prev=null;this.startT=null;this.reset();
  }
  reset(){this.state="idle";this.track=[];this.lastMotionT=0;this.flyStart=0;this.coolUntil=0;}
  pause(){this.prev=null;this.prevUV=null;this.track=[];}          // 手機在動時呼叫：丟掉舊畫面，重新開始比較
  /* 估計整個畫面相對上一張偏移了幾格（抵消手持晃動） */
  globalShift(g,p,W,H){
    const m=this.o.maxShift;let best=[0,0],bestSad=Infinity;
    for(let dy=-m;dy<=m;dy++)for(let dx=-m;dx<=m;dx++){
      let sad=0;
      for(let y=m;y<H-m;y+=2)for(let x=m;x<W-m;x+=2) sad+=Math.abs(g[y*W+x]-p[(y-dy)*W+(x-dx)]);
      if(sad<bestSad){bestSad=sad;best=[dx,dy];}
    }
    return best;
  }
  /* gray：W×H 亮度（0~255）；uv：可選的色彩差 [U,V]（同樣大小），讓亮度相近但顏色不同的球也看得到 */
  update(t,gray,W,H,uv){
    const o=this.o,N=W*H;let blob=null,event=null;
    this.startT??=t;
    if(this.prev){
      const p=this.prev,pu=this.prevUV,[dx,dy]=this.globalShift(gray,p,W,H),m=o.maxShift,cw=o.chromaWeight;
      const mask=new Uint8Array(N);let moving=0,count=0;
      for(let y=m+1;y<H-m-1;y++)for(let x=m+1;x<W-m-1;x++){
        const k=y*W+x,pk=(y-dy)*W+(x-dx);
        const grad=Math.abs(p[pk+1]-p[pk-1])+Math.abs(p[pk+W]-p[pk-W]);     // 有紋理的地方門檻提高
        count++;
        let diff=Math.abs(gray[k]-p[pk]);
        if(uv&&pu) diff+=cw*(Math.abs(uv[0][k]-pu[0][pk])+Math.abs(uv[1][k]-pu[1][pk]));
        if(diff>o.diffThreshold+o.gradientWeight*grad){mask[k]=1;moving++;}
      }
      if(moving<count*o.ignoreFraction){
        const b=largestBlob(mask,W,H);
        if(b&&b.n>=o.minPixels&&b.n<=N*o.maxFraction&&b.bw<=o.maxSize&&b.bh<=o.maxSize) blob=b;
      }

    this.prev=gray;this.prevUV=uv||null;
    if(t-this.startT<o.warmupMs) return {blob:null,event:null};       // 相機剛開，曝光還在調
    if(this.state==="idle"){
      if(blob&&t>=this.coolUntil){
        const last=this.track[this.track.length-1];
        const step=last?Math.hypot(blob.x-last.x,blob.y-last.y):0;
        if(last&&(step<o.minStep||step>o.maxStep)) this.track=[];       // 沒在動或亂跳 → 重來
        this.track.push({x:blob.x,y:blob.y});

          const tr=this.track,a=tr[0],z=tr[tr.length-1];
          // 方向要連貫（揮手會來回擺動）

            const v1=[tr[k-1].x-tr[k-2].x,tr[k-1].y-tr[k-2].y],v2=[tr[k].x-tr[k-1].x,tr[k].y-tr[k-1].y];

      if(blob) this.lastMotionT=t;

      if((flight>=o.minFlightMs&&t-this.lastMotionT>=o.stillMs)||flight>=o.maxFlightMs){

}
function largestBlob(mask,W,H){
  const seen=new Uint8Array(W*H),stack=[];let best=null;
  for(let i=0;i<W*H;i++){

    let n=0,sx=0,sy=0,x0=W,x1=0,y0=H,y1=0;stack.push(i);seen[i]=1;
    while(stack.length){
      const k=stack.pop(),x=k%W,y=(k/W)|0;n++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(const nb of [x>0?k-1:-1,x<W-1?k+1:-1,y>0?k-W:-1,y<H-1?k+W:-1]) if(nb>=0&&mask[nb]&&!seen[nb]){seen[nb]=1;stack.push(nb);}
    }
    if(!best||n>best.n) best={n,x:(sx/n+.5)/W,y:(sy/n+.5)/H,r:Math.sqrt(n/Math.PI)/W,bw:(x1-x0+1)/W,bh:(y1-y0+1)/H};
  }

}

async function loadBallDetector(){

const BALL_MODE_KEY="colormon-ball-mode";

function frameYUV(px,N){
  const y=new Uint8Array(N),u=new Int16Array(N),v=new Int16Array(N);
  for(let i=0;i<N;i++){const r=px[i*4],g=px[i*4+1],b=px[i*4+2];const Y=(r*77+g*150+b*29)>>8;y[i]=Y;u[i]=(b-Y)>>1;v[i]=(r-Y)>>1;}
  return {y,uv:[u,v]};

function arFrameYUV(){
  const v=$("arVideo"),W=AR.W,H=AR.H,ctx=AR.cv.getContext("2d",{willReadFrequently:true});

}
/* 影片座標(0~1) → 場景座標（影片是 object-fit:cover） */
function videoToScene(nx,ny){
  const v=$("arVideo"),s=$("scene").getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight;
  const k=Math.max(s.width/vw,s.height/vh),dw=vw*k,dh=vh*k;
  return {x:nx*dw-(dw-s.width)/2,y:ny*dh-(dh-s.height)/2};
}
function arLoop(t){

  const w=AR.watcher;
  if(performance.now()<phoneMovingUntil){
    w.pause();AR.longWatcher.pause();$("ballMark").hidden=true;$("arChip").textContent="手機晃動太大，稍微拿穩一點";return;
  }

  }

  if(target&&arConfig().showMarker!==false){
    const p=videoToScene(target.x,target.y),d=Math.max(28,target.r*2*$("scene").clientWidth*1.3);
    mark.hidden=false;mark.style.borderColor=ball?"#4CC27E":"#FFC53D";

  }else mark.hidden=true;

  const fire=()=>{AR.throwActive=true;AR.pendingUntil=0;sfx("throw");window.onBallThrown();if(w.state!=="flying"){w.state="flying";w.flyStart=t;w.lastMotionT=t;}};
  // 偵測模式：strict 要認出是球；standard 認出是球、或長距離平滑移動；loose 只看移動

    const tr=AR.ballTrack,ballMoving=tr.length>=2&&Math.hypot(tr[tr.length-1].x-tr[0].x,tr[tr.length-1].y-tr[0].y)>=oc.minTravel;

  $("arChip").textContent=(w.state==="flying"&&AR.throwActive)?"丟進來了！":AR.pendingUntil&&mode==="strict"?"有東西在動…是球嗎？":arArmed()?`把球丟進畫面裡！（${how}）`:"等一下…";
}

/* =========================================================
   探索模式：相機一直開著，寶可夢藏在某個方向，
   用陀螺儀算出鏡頭朝向，越接近提示越強（呼吸光、雷達聲、震動），對準就自動截圖
   ========================================================= */
const EX={started:false,stream:null,raf:0,rawYaw:null,rawPitch:null,manual:0,manualPitch:0,target:{yaw:0,pitch:0},steps0:0,stepsLeft:0,
          lock:0,nextBeat:0,flat:false,hasOrient:false,hasMotion:false,found:false,lastStepT:0,stepArmed:true,gBase:9.8};
function exConfig(){return {foundDeg:15,holdMs:700,minTargetDeg:70,maxTargetDeg:170,minPitch:-20,maxPitch:35,minSteps:2,maxSteps:5,
  towardDeg:50,stepThreshold:2.2,slowBeatMs:1300,fastBeatMs:140,...(CFG?.explore||{})};}
/* 鏡頭（手機背面）朝向：水平角度 yaw ＋ 仰角 pitch（三個軸都用到，任何握法都適用） */
function cameraYaw(a,b,g){
  const A=a*Math.PI/180,B=b*Math.PI/180,G=g*Math.PI/180;
  const vx=-(Math.cos(A)*Math.sin(G)+Math.sin(A)*Math.sin(B)*Math.cos(G));
  const vy=-(Math.sin(A)*Math.sin(G)-Math.cos(A)*Math.sin(B)*Math.cos(G));
  const vz=-(Math.cos(B)*Math.cos(G));
  const pitch=Math.asin(Math.max(-1,Math.min(1,vz)))*180/Math.PI;
  return {yaw:Math.atan2(vx,vy)*180/Math.PI, pitch, flat:Math.abs(pitch)>65};
}
const dirVec=(y,p)=>{const Y=y*Math.PI/180,P=p*Math.PI/180;return [Math.cos(P)*Math.sin(Y),Math.cos(P)*Math.cos(Y),Math.sin(P)];};
const angBetween=(a,b)=>{const u=dirVec(a.yaw,a.pitch),v=dirVec(b.yaw,b.pitch);return Math.acos(Math.max(-1,Math.min(1,u[0]*v[0]+u[1]*v[1]+u[2]*v[2])))*180/Math.PI;};
const angDiff=(a,b)=>((a-b+540)%360)-180;
addEventListener("deviceorientation",e=>{
  if(e.alpha==null)return;

  EX.rawPitch=EX.rawPitch==null?r.pitch:EX.rawPitch+(r.pitch-EX.rawPitch)*0.35;
});
function currentYaw(){return (EX.rawYaw??0)+EX.manual;}
function currentPitch(){return Math.max(-80,Math.min(80,(EX.rawPitch??0)+EX.manualPitch));}
/* 走路：加速度計的步伐偵測（每一步會有一個重力以外的加速度尖峰） */
addEventListener("devicemotion",e=>{
  const a=e.accelerationIncludingGravity;if(!a||a.x==null)return;
  EX.hasMotion=true;
  const mag=Math.hypot(a.x,a.y,a.z);
  EX.gBase+= (mag-EX.gBase)*0.05;                                 // 慢慢追蹤重力基準
  const dev=mag-EX.gBase,c=exConfig(),now=performance.now();
  if(dev>c.stepThreshold&&EX.stepArmed&&now-EX.lastStepT>330){EX.stepArmed=false;EX.lastStepT=now;exStep();}
  if(dev<c.stepThreshold*0.4) EX.stepArmed=true;

function exStep(){

(function(){

function exLoop(t){

  // 熱度：方向越準越熱；還沒走到的話打折，走越近越熱
  const stepFactor=EX.steps0?1-0.45*EX.stepsLeft/EX.steps0:1;
  const warm=Math.max(0,1-ad/180)**2*stepFactor;
  setWarm(warm);
  const aimed=ad<=c.foundDeg, slack=c.foundDeg*0.7;
  $("exLeft").hidden=!(!aimed&&dYaw>slack);$("exRight").hidden=!(!aimed&&dYaw<-slack);
  $("exUp").hidden=!(!aimed&&dPitch>slack);$("exDown").hidden=!(!aimed&&dPitch<-slack);
  $("exWalk").hidden=!(aimed&&EX.stepsLeft>0);
  $("exText").textContent=aimed?(EX.stepsLeft>0?`對準了！往前走 ${EX.stepsLeft} 步`:"就在這裡！別動…")
    :ad<35?(Math.abs(dPitch)>Math.abs(dYaw)?(dPitch>0?"在上面一點！":"在下面一點！"):"非常接近了！")
    :ad<80?"越來越近了":"慢慢轉動手機找找看";
  $("exReticle").classList.toggle("hot",aimed);
  // 節拍：越近越快，每一拍同時閃光、雷達聲、震動
  if(t>=EX.nextBeat){
    const iv=c.slowBeatMs-(c.slowBeatMs-c.fastBeatMs)*warm;
    EX.nextBeat=t+iv;
    pulse(warm,iv);
  }
  // 對準、而且走到了，維持一下就找到
  if(aimed&&EX.stepsLeft<=0){EX.lock||=t;if(t-EX.lock>=c.holdMs)foundPokemon();}
  else EX.lock=0;
}
function frameIsBlack(v){
  const c=document.createElement("canvas");c.width=32;c.height=24;const g=c.getContext("2d",{willReadFrequently:true});
  try{g.drawImage(v,0,0,32,24);}catch(e){return true;}
  const d=g.getImageData(0,0,32,24).data;let sum=0,max=0;
  for(let i=0;i<d.length;i+=4){const l=(d[i]+d[i+1]+d[i+2])/3;sum+=l;if(l>max)max=l;}
  return sum/(d.length/4)<6&&max<20;                           // 全黑（真的很暗的房間也會有一點雜訊）
}
function setWarm(w){
  const v=$("exView");v.style.setProperty("--warm",w.toFixed(3));
  const col=w<.5?mix([90,168,255],[255,213,74],w*2):mix([255,213,74],[255,90,60],(w-.5)*2);
  v.style.setProperty("--glowc",`rgb(${col.join(",")})`);
  $("heatBar").style.width=Math.round(w*100)+"%";$("exDot").style.background=`rgb(${col.join(",")})`;
}
const mix=(a,b,k)=>a.map((x,i)=>Math.round(x+(b[i]-x)*Math.max(0,Math.min(1,k))));
function pulse(w,iv){
  $("exGlow").animate([{opacity:.25+.75*w},{opacity:.08}],{duration:Math.min(700,iv*.9),easing:"ease-out"});
  sfx("radar",w);
  try{navigator.vibrate&&navigator.vibrate(Math.round(15+90*w));}catch(e){}   // Android 才有；iPhone 會自動略過
}
async function foundPokemon(){
  EX.found=true;setWarm(1);
  $("exText").textContent="找到了！";$("exLeft").hidden=$("exRight").hidden=true;
  sfx("found");
  try{navigator.vibrate&&navigator.vibrate([90,60,90,60,250]);}catch(e){}
  $("exGlow").animate([{opacity:1},{opacity:.2}],{duration:700});
  // 截下對準時的畫面，用它的顏色決定寶可夢
  const v=$("exVideo");let src;
  if(EX.stream&&(!v.videoWidth||frameIsBlack(v))){             // 相機畫面是黑的（被停掉或還沒好）→ 不截圖，重新開相機
    EX.stream=streamLive(EX.stream)?EX.stream:null;await startExploreCamera();await wait(900);
    if(!v.videoWidth||frameIsBlack(v)){toast("相機畫面是黑的，請再對準一次");EX.found=false;EX.lock=0;return;}
  }
  if(v.videoWidth){const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);src=c.toDataURL("image/jpeg",.85);}
  else src=sample(["grass","sky","sunset","banana","night"][Math.floor(Math.random()*5)]);
  await wait(900);
  if(screen==="explore") startScan(src);
}

/* =========================================================
   Game Boy 風格音效（全部原創，用程式即時合成，不用音效檔）
   兩個方波通道（可調佔空比 12.5% / 25% / 50%）＋ 一個噪音通道，跟 Game Boy 的音源一樣
   ========================================================= */
let audioCtx=null;
const MUTE_KEY="colormon-mute";
let muted=false;try{muted=localStorage.getItem(MUTE_KEY)==="1";}catch(e){}
function unlockAudio(){try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state!=="running")audioCtx.resume();}catch(e){}}
addEventListener("pointerdown",unlockAudio,{passive:true});
const GB={
  waves:{},noiseBuf:null,
  wave(duty){                                   // 方波的佔空比用傅立葉係數做成 PeriodicWave
    if(this.waves[duty])return this.waves[duty];
    const n=48,re=new Float32Array(n),im=new Float32Array(n);
    for(let k=1;k<n;k++){re[k]=0;im[k]=2/(k*Math.PI)*Math.sin(k*Math.PI*duty);}
    return this.waves[duty]=audioCtx.createPeriodicWave(re,im);
  },
  out(){ if(!this.master){this.master=audioCtx.createGain();this.master.gain.value=.16;this.master.connect(audioCtx.destination);} return this.master; },
  /* 一個音：頻率 f（或 [起,終] 做滑音），時長 d，佔空比 duty，音量 v */
  tone(t,f,d,{duty=.5,v=.5,slide=null,decay=true}={}){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.setPeriodicWave(this.wave(duty));
    o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);
    if(decay) g.gain.exponentialRampToValueAtTime(.001,t+d); else {g.gain.setValueAtTime(v,t+d-.01);g.gain.linearRampToValueAtTime(0,t+d);}
    o.connect(g).connect(this.out());o.start(t);o.stop(t+d+.02);
  },
  noise(t,d,{v=.4,hp=800}={}){
    if(!this.noiseBuf){const b=audioCtx.createBuffer(1,audioCtx.sampleRate*.5,audioCtx.sampleRate),c=b.getChannelData(0);
      let lfsr=0x7fff;for(let i=0;i<c.length;i++){const bit=(lfsr^(lfsr>>1))&1;lfsr=(lfsr>>1)|(bit<<14);c[i]=(lfsr&1)?.8:-.8;} this.noiseBuf=b;}
    const s=audioCtx.createBufferSource(),f=audioCtx.createBiquadFilter(),g=audioCtx.createGain();
    s.buffer=this.noiseBuf;s.loop=true;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    s.connect(f).connect(g).connect(this.out());s.start(t);s.stop(t+d+.02);
  },
  /* 旋律："E5:1 G5:1 -:1 C6:2"（音名:拍數，- 是休止） */
  seq(t,str,beat,opt){
    for(const tok of str.trim().split(/\s+/)){
      const [n,len]=tok.split(":"),d=beat*(+len||1);
      if(n!=="-") this.tone(t,noteHz(n),d*.95,opt);
      t+=d;
    }
    return t;
  },
};
function noteHz(n){const m=/^([A-G])(#?)(\d)$/.exec(n);const idx={C:-9,D:-7,E:-5,F:-4,G:-2,A:0,B:2}[m[1]]+(m[2]?1:0)+(+m[3]-4)*12;return 440*Math.pow(2,idx/12);}

const SFX={
  appear:t=>{ GB.seq(t,"B4:1 D5:1 F#5:1 B5:1 D6:1 F#6:2",.05,{duty:.125,v:.45});            // 「！」快速上升琶音
              GB.seq(t,"B3:3 F#4:3",.05,{duty:.5,v:.3}); },
  reveal:t=>{ GB.seq(t,"E6:1 G6:1 B6:1 E7:3",.045,{duty:.125,v:.35}); GB.noise(t+.18,.15,{v:.15,hp:5000}); },   // 揭曉：閃亮聲
  throw:t=>{ GB.tone(t,1400,.28,{duty:.25,v:.4,slide:260}); GB.noise(t,.22,{v:.18,hp:2500}); },              // 咻～
  hit:t=>{ GB.noise(t,.08,{v:.35,hp:1200}); GB.tone(t,880,.12,{duty:.5,v:.3,slide:440}); },
  shake:t=>{ GB.noise(t,.05,{v:.3,hp:600}); GB.tone(t,180,.06,{duty:.5,v:.35}); },                           // 喀噠
  caught:t=>{ const b=.11;                                                                                    // 原創小勝利曲
              const e=GB.seq(t,"C5:1 E5:1 G5:1 C6:2 G5:1 C6:4",b,{duty:.25,v:.42,decay:false});
              GB.seq(t,"E4:1 G4:1 C5:1 E5:2 E5:1 E5:4",b,{duty:.5,v:.22,decay:false});
              GB.noise(t,.06,{v:.25,hp:3000}); GB.noise(t+3*b,.06,{v:.25,hp:3000}); },
  escape:t=>{ GB.noise(t,.12,{v:.4,hp:400}); GB.seq(t+.05,"G5:1 D5:1 G4:2",.06,{duty:.5,v:.35}); },            // 跳出來：啵
  flee:t=>{ GB.seq(t,"A5:1 F5:1 D5:1 A4:1 F4:2",.05,{duty:.25,v:.35}); },                                      // 玩家逃跑：快速下降
  tap:t=>{ GB.tone(t,1320,.03,{duty:.5,v:.2}); },
  step:t=>{ GB.noise(t,.04,{v:.25,hp:300}); GB.tone(t,240,.05,{duty:.5,v:.25,slide:160}); },                  // 腳步：咚
  radar:(t,w=0)=>{ GB.tone(t,500+900*w,.05+.03*w,{duty:.125,v:.25+.2*w}); },                                  // 探索雷達：越近越高
  found:t=>{ const e=GB.seq(t,"C6:1 -:1 C6:1 -:1 C6:1 -:1",.07,{duty:.25,v:.45});                              // 噔噔噔
             GB.seq(e,"G5:1 C6:1 E6:1 G6:4",.06,{duty:.125,v:.4}); GB.seq(e,"C4:7",.06,{duty:.5,v:.25}); },
};
function sfx(name,arg){
  if(muted||!audioCtx||audioCtx.state!=="running")return;
  try{ SFX[name]?.(audioCtx.currentTime+.01,arg); }catch(e){}
}
function setMuted(m){
  muted=m;try{localStorage.setItem(MUTE_KEY,m?"1":"0");}catch(e){}
  $("muteBtn").setAttribute("aria-pressed",m);$("muteBtn").setAttribute("aria-label",m?"開啟音效":"關閉音效");
  $("muteIcon").setAttribute("d",m?"M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4L15.2 10.6 12.5 7.9l-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"
                                  :"M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z");
}
$("muteBtn").onclick=()=>{unlockAudio();setMuted(!muted);if(!muted)setTimeout(()=>sfx("tap"),30);};
setMuted(muted);
