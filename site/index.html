<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>顏色寶可夢探險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap">
<style>
/* Layout: one screen at a time, like a handheld game — camera → scan → encounter → result, dex on the side */
:root{
  --bg:#EAF1F8; --card:#FFFFFF; --ink:#18202E; --muted:#5B6678; --line:#D3DDE9;
  --sun:#FFC53D; --sunInk:#3A2A00; --good:#2E9E5B; --bad:#D9534F;
  --display:"Baloo 2","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --type:#9AA0A6; --main:#9AA0A6; --accent:#cccccc; --glyph:#ffffff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111723; --card:#1A2232; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C374B;
  --sun:#FFC53D; --sunInk:#2A1E00; --good:#4CC27E; --bad:#F07A75; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111723; --card:#1A2232; --ink:#EEF2F8; --muted:#9AA6BA; --line:#2C374B;
  --sun:#FFC53D; --sunInk:#2A1E00; --good:#4CC27E; --bad:#F07A75; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 20px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,label.btn:focus-within{outline:3px solid var(--sun);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:48px}
.bar h1{font-family:var(--display);font-weight:900;font-size:1.3rem;margin:0;flex:1;line-height:1.2}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.dex-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.dex-btn b{font-family:var(--display);font-variant-numeric:tabular-nums}

.screen{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px;animation:enter .3s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;padding:14px;font-weight:900;font-size:1.05rem;border:0;position:relative;cursor:pointer;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--sunInk)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn input{position:absolute;opacity:0;width:1px;height:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* camera screen */
.viewer{position:relative;width:100%;max-width:100%;aspect-ratio:3/4;max-height:60vh;border-radius:20px;overflow:hidden;background:#0d1117;display:grid;place-items:center}
.viewer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.reticle{position:absolute;width:56%;aspect-ratio:1;border:3px dashed rgba(255,255,255,.85);border-radius:50%;pointer-events:none}
.live-chip{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 14px 6px 6px;font-size:.9rem;font-weight:700}
.live-chip i{width:26px;height:26px;border-radius:50%;flex:none;border:2px solid #fff;background:#888}
.cam-off{position:relative;color:#cfd6e2;text-align:center;padding:24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cam-off p{margin:0;font-size:.92rem}
.shutter{width:78px;height:78px;border-radius:50%;border:6px solid var(--ink);background:var(--sun);align-self:center;box-shadow:0 0 0 4px var(--bg) inset}
.shutter:active{transform:scale(.94)}
.note{font-size:.84rem;color:var(--muted);margin:0;text-align:center}
.samples{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.samples span{font-size:.84rem;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.86rem}

/* scan screen */
.scan-photo{position:relative;width:100%;max-width:100%;aspect-ratio:1;max-height:52vh;margin:0 auto;border-radius:20px;overflow:hidden;background:#000}
.scan-photo img{width:100%;height:100%;object-fit:cover;display:block}
.scan-photo::after{content:"";position:absolute;left:0;right:0;height:22%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.55),transparent);animation:scan 1.1s linear infinite}
@keyframes scan{from{top:-22%}to{top:100%}}
.scan-text{text-align:center;font-weight:900;font-size:1.15rem;min-height:1.6em}
.palette{display:flex;height:30px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.palette i{display:block;height:100%;flex:0;transition:flex .6s ease-out}
.pal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pal-legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:4px;border:1px solid var(--line)}

/* encounter scene */
.scene{position:relative;width:100%;height:min(54vh,460px);min-height:300px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--main) 35%,var(--card)),var(--card) 75%)}
.scene-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(14px) saturate(1.2);opacity:.45}
.ground{position:absolute;left:18%;right:18%;top:68%;height:16%;border-radius:50%;background:color-mix(in srgb,var(--ink) 14%,transparent)}
.mon{position:absolute;z-index:2;left:50%;top:40%;width:58%;max-width:230px;aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center}
.mon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:filter .6s}
.mon .fb{width:72%;aspect-ratio:1;border-radius:50%;background:var(--main);box-shadow:0 0 0 10px var(--accent);display:grid;place-items:center;transition:filter .6s}
.mon .fb svg{width:46%;height:46%;fill:var(--glyph)}
.ball{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;will-change:transform;z-index:3}
.ball img{width:100%;height:100%;image-rendering:pixelated;display:block}
.ball .cap{position:absolute;inset:3px;border-radius:50%;background:var(--sun);border:4px solid var(--ink)}
.ball .cap::after{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--card);border:3px solid var(--ink)}
.ball.has-img .cap{display:none}
.ball.locked img{filter:brightness(.75)}
.ball.locked .cap::after{background:var(--ink)}
.ball-shadow{position:absolute;left:0;top:0;width:44px;height:12px;margin:-6px 0 0 -22px;border-radius:50%;background:rgba(0,0,0,.25);z-index:2;opacity:0}
.hand{position:absolute;left:50%;top:auto;bottom:10px;margin-top:0;width:64px;height:64px;margin-left:-32px;z-index:3;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.flash{position:absolute;left:0;top:0;width:160px;height:160px;margin:-80px 0 0 -80px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff 30%,transparent 70%);opacity:0;pointer-events:none;z-index:4}
.fx i{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);z-index:5}
.bubble{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:999px;padding:4px 16px;font-weight:900;white-space:nowrap;z-index:6;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
.bubble:empty{display:none}
.shake-dots{position:absolute;right:14px;bottom:14px;display:flex;gap:6px;z-index:6}
.shake-dots i{width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--ink) 20%,transparent)}
.shake-dots i.on{background:var(--sun);box-shadow:0 0 0 2px var(--ink)}

.info{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.info .name{font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1.1;margin:0}
.type-pill{background:var(--type);color:#fff;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.82rem}
.stars{color:#E8A100;letter-spacing:1px}
.orbs{margin-left:auto;display:flex;gap:6px}
.orbs b{width:14px;height:14px;border-radius:50%;background:var(--sun);border:2px solid var(--ink)}
.orbs b.used{background:transparent;opacity:.3}
.orbs img{width:22px;height:22px;image-rendering:pixelated}
.orbs img.used{opacity:.25;filter:grayscale(1)}
.why{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dots{display:inline-flex;gap:3px}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line)}
.meter{width:100%;height:24px;border-radius:12px;background:var(--line);position:relative;overflow:hidden}
.meter .zone{position:absolute;left:62%;width:26%;top:0;bottom:0;background:color-mix(in srgb,var(--good) 55%,transparent)}
.meter .zone::after{content:"";position:absolute;left:46%;width:8%;top:0;bottom:0;background:var(--good)}
.meter .needle{position:absolute;top:-2px;bottom:-2px;width:5px;border-radius:3px;background:var(--ink);left:0}
.throw{touch-action:manipulation;user-select:none;-webkit-user-select:none;font-size:1.2rem;padding:18px}
.hw{font-size:.82rem;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:center}
.hw .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.hw.on .dot{background:var(--good)}
.throw:disabled{opacity:.45;cursor:default}

/* real-ball mode: live camera behind the scene */
.ar-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.scene.ar .scene-bg,.scene.ar .ground{display:none}
.scene.ar .mon{top:36%}
.ar-chip{position:absolute;left:10px;bottom:10px;z-index:6;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:700;max-width:calc(100% - 70px)}
.ball-mark{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:3px solid #4CC27E;border-radius:50%;z-index:5;pointer-events:none;transition:transform .06s linear}
.calib{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.35);color:#fff;text-align:center;padding:16px}
.calib .ring{width:38%;aspect-ratio:1;border:4px dashed #fff;border-radius:50%}
.calib p{margin:0;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.mode-btn{font-size:.92rem;padding:10px}
.mode-btn[aria-pressed="true"]{border-color:var(--good);color:var(--good)}

/* result screen */
.result{align-items:center;text-align:center;justify-content:center}
.burst{position:relative;width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center}
.burst::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(color-mix(in srgb,var(--main) 45%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 12s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
@keyframes spin{to{transform:rotate(360deg)}}
.burst img,.burst .fb{position:relative;width:80%;height:80%;object-fit:contain;animation:popin .6s cubic-bezier(.3,1.6,.5,1)}
.burst .fb{width:60%;height:60%;border-radius:50%;background:var(--main);box-shadow:0 0 0 10px var(--accent);display:grid;place-items:center}
.burst .fb svg{width:46%;height:46%;fill:var(--glyph)}
@keyframes popin{from{transform:scale(.2)}}
.got{font-family:var(--display);font-weight:900;font-size:1.1rem;color:var(--good);margin:0}
.result .name{font-family:var(--display);font-weight:900;font-size:2.2rem;margin:0;line-height:1.1}
.result .sub{color:var(--muted);font-variant-numeric:tabular-nums}
.result .actions{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* dex screen */
.dex-head{display:flex;justify-content:space-between;align-items:baseline}
.dex-head h2{margin:0;font-family:var(--display);font-weight:900;font-size:1.4rem}
.dex-head span{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--sun)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.dex div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;font-size:.84rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;position:relative}
.dex div img{width:64px;height:64px;image-rendering:pixelated}
.dex div .sw{width:40px;height:40px;border-radius:50%;margin:12px 0}
.dex div b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:.76rem;color:var(--muted);font-weight:600}
.dex div span{font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dex div em{position:absolute;top:6px;right:8px;font-style:normal;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:32px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;transition:opacity .3s;pointer-events:none;max-width:calc(100% - 32px);z-index:20}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.hand{animation:none}.screen,.burst img,.burst .fb{animation:none}.burst::before,.scan-photo::after{animation:none}}
</style>

<div class="app">
  <div class="bar">
    <button class="icon-btn" id="backBtn" aria-label="回到拍照" hidden><svg viewBox="0 0 24 24"><path d="M15.4 4.6 14 3.2 5.2 12 14 20.8l1.4-1.4L8 12z"/></svg></button>
    <h1 id="barTitle">顏色寶可夢探險</h1>
    <button class="dex-btn" id="dexBtn">圖鑑 <b id="dexCount">0</b></button>
  </div>

  <!-- 1 拍照 -->
  <section class="screen" id="s-camera">
    <div class="viewer" id="viewer">
      <video id="video" playsinline muted autoplay hidden></video>
      <div class="cam-off" id="camOff">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4h6l1.5 2H20a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3.5L9 4zm3 4.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
        <p id="camMsg">對準身邊的東西，顏色最像哪隻寶可夢，牠就會出現</p>
        <button class="btn sun" id="liveBtn">打開相機</button>
      </div>
      <div class="reticle" id="reticle" hidden></div>
      <div class="live-chip" id="liveChip" hidden><i id="liveDot"></i><span id="liveText">對準中…</span></div>
    </div>
    <button class="shutter" id="shutter" aria-label="拍照" hidden></button>
    <label class="btn ghost" for="photo">用手機相機拍一張 / 選照片
      <input id="photo" type="file" accept="image/*" capture="environment">
    </label>
    <div class="samples"><span>範例：</span>
      <button class="chip" data-s="grass">草地</button><button class="chip" data-s="sky">天空</button>
      <button class="chip" data-s="sunset">夕陽</button><button class="chip" data-s="banana">香蕉</button>
      <button class="chip" data-s="night">夜晚</button>
    </div>
  </section>

  <!-- 2 分析 -->
  <section class="screen" id="s-scan" hidden>
    <div class="scan-photo"><img id="scanImg" alt="拍到的照片"></div>
    <div class="scan-text" id="scanText">分析顏色中…</div>
    <div class="palette" id="palette"></div>
    <div class="pal-legend" id="palLegend"></div>
  </section>

  <!-- 3 遭遇 -->
  <section class="screen" id="s-encounter" hidden>
    <div class="scene" id="scene">
      <video class="ar-video" id="arVideo" playsinline muted autoplay hidden></video>
      <div class="scene-bg" id="sceneBg"></div>
      <div class="ground"></div>
      <div class="mon" id="mon"><img id="art" alt="" hidden><div class="fb" id="monFb"><svg viewBox="0 0 24 24"><path id="glyph" d=""/></svg></div></div>
      <div class="ball-shadow" id="ballShadow"></div>
      <div class="ball" id="ball" hidden><div class="cap"></div><img alt="" hidden></div>
      <div class="ball hand" id="hand"><div class="cap"></div><img alt="" hidden></div>
      <div class="flash" id="flash"></div>
      <div class="fx" id="fx"></div>
      <div class="bubble" id="bubble"></div>
      <div class="shake-dots" id="shakeDots" hidden><i></i><i></i><i></i></div>
      <div class="ball-mark" id="ballMark" hidden></div>
      <div class="ar-chip" id="arChip" hidden></div>
      <div class="calib" id="calib" hidden>
        <div class="ring"></div>
        <p>把球放進圓圈裡，讓鏡頭記住它的顏色</p>
        <button class="btn sun" id="calibBtn">記住這顆球</button>
      </div>
    </div>
    <div class="info">
      <h2 class="name" id="monName"></h2>
      <span class="type-pill" id="monType"></span><span class="stars" id="monStars"></span>
      <div class="orbs" id="orbs"></div>
    </div>
    <div class="why">照片 <span class="dots" id="whyPhoto"></span> 牠的顏色 <span class="dots" id="whyMon"></span> <span id="sim"></span></div>
    <div id="throwArea" style="display:flex;flex-direction:column;gap:10px">
      <button class="btn sun throw" id="throwBtn">丟出寶貝球！</button>
      <button class="btn ghost mode-btn" id="motionBtn" aria-pressed="false">真球模式：把球丟進鏡頭畫面</button>
      <div class="hw" id="hw"><span class="dot"></span><span id="hwText">按「丟出寶貝球！」，或打開真球模式</span><button class="chip" id="recalBtn" hidden>重新記住球</button></div>
    </div>
    <button class="btn primary" id="fledBtn" hidden>繼續拍照</button>
  </section>

  <!-- 4 抓到了 -->
  <section class="screen result" id="s-result" hidden>
    <p class="got">抓到了！</p>
    <div class="burst" id="burst"></div>
    <h2 class="name" id="resName"></h2>
    <div class="info" style="justify-content:center"><span class="type-pill" id="resType"></span><span class="stars" id="resStars"></span></div>
    <div class="sub" id="resSub"></div>
    <div class="actions">
      <button class="btn primary" id="moreBtn">繼續拍照</button>
      <button class="btn ghost" id="toDexBtn">看圖鑑</button>
    </div>
  </section>

  <!-- 圖鑑 -->
  <section class="screen" id="s-dex" hidden>
    <div class="dex-head"><h2>我的圖鑑</h2><span id="dexTotal"></span></div>
    <div class="progress"><i id="dexBar" style="width:0"></i></div>
    <div class="dex" id="dex"></div>
  </section>
</div>
<div class="toast" id="toast"></div>
<canvas id="cv" width="48" height="48" hidden></canvas>

<script>
/* =========================================================
   顏色寶可夢探險
   資料都在 data/：config.json 列出要載入的資料包（packs），
   types.json 定義屬性，packs/*.json 定義寶可夢。新增寶可夢只要加資料包。
   ========================================================= */
const DATA_BASE = "data/";
let CFG = null, TYPES = {}, MONS = [];

/* ---------- 硬體介面（之後接寶貝球） ----------
   寶貝球只需要回報兩件事，不判斷丟得好不好：
     window.onBallThrown()  偵測到被丟出去（出手 / 自由落體）
     window.onBallLanded()  偵測到落地（撞擊後靜止）
   Hardware.notifyEncounter(mon)：寶可夢出現時呼叫，可在這裡送出提醒指令      */
const Hardware = {
  connected: false,
  notifyEncounter(mon) {
    // TODO: 送指令給寶貝球，例如 ws.send(JSON.stringify({cmd:"alert", id:mon.id}))
    try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
  },
};
window.onBallThrown = () => throwBall();

/* ---------- 色彩工具：sRGB → CIELAB ---------- */
function linTable(){return linTable.t||(linTable.t=Array.from({length:256},(_,i)=>{const c=i/255;return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}));}
function rgbLab(r,g,b){
  const L=linTable(),R=L[r],G=L[g],B=L[b];
  const x=(R*0.4124+G*0.3576+B*0.1805)/0.95047,y=R*0.2126+G*0.7152+B*0.0722,z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116, fy=f(y);
  return [116*fy-16,500*(f(x)-fy),200*(fy-f(z))];
}
function hexLab(h){const n=parseInt(h.slice(1),16);return rgbLab(n>>16,(n>>8)&255,n&255);}
const dE=(p,q)=>Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2]);
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;
  if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx];}
const HUE=[[15,"紅"],[40,"橘"],[68,"黃"],[95,"黃綠"],[160,"綠"],[195,"水藍"],[250,"藍"],[290,"紫"],[345,"粉紅"],[361,"紅"]];
function colorWord([r,g,b]){
  const [h,s,v]=rgb2hsv(r,g,b);
  if(v<0.2) return "黑色";
  if(s<0.15) return v>0.82?"白色":v<0.4?"深灰色":"灰色";
  if(h>=15&&h<50&&v<0.62) return "咖啡色";
  const name=HUE.find(([l])=>h<l)[1];
  return (v<0.42?"深":(s<0.42&&v>0.72?"淺":""))+name+"色";
}
const css=([r,g,b])=>`rgb(${r|0},${g|0},${b|0})`;
function fnv1a(str){let h=0x811c9dc5;for(const ch of str){h^=ch.codePointAt(0);h=Math.imul(h,0x01000193)>>>0}return h>>>0;}
function rng(seed){let a=seed;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function today(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;}

/* ---------- 照片 → 主要色盤（中心加權 + Lab 空間 k-means） ---------- */
function palette(src,w,h){
  const N=48,cv=document.getElementById("cv"),ctx=cv.getContext("2d",{willReadFrequently:true});
  const s=Math.min(w,h); ctx.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,N,N);
  const px=ctx.getImageData(0,0,N,N).data, P=[];
  for(let i=0;i<N*N;i++){
    const x=i%N,y=(i/N)|0,dist=Math.hypot(x-(N-1)/2,y-(N-1)/2)/(N*0.7);
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    P.push({lab:rgbLab(r,g,b),rgb:[r,g,b],w:1+2*Math.max(0,1-dist)});
  }
  const K=5,W=P.reduce((a,p)=>a+p.w,0);
  let C=[[0,1,2].map(k=>P.reduce((a,p)=>a+p.lab[k]*p.w,0)/W)];
  while(C.length<K){let best=null,bd=-1;for(const p of P){const d=Math.min(...C.map(c=>dE(c,p.lab)))*p.w;if(d>bd){bd=d;best=p;}}C.push(best.lab.slice());}
  let groups;
  for(let it=0;it<10;it++){
    groups=C.map(()=>({w:0,lab:[0,0,0],rgb:[0,0,0]}));
    for(const p of P){let bi=0,bd=1e9;C.forEach((c,i)=>{const d=dE(c,p.lab);if(d<bd){bd=d;bi=i;}});
      const g=groups[bi];g.w+=p.w;for(let k=0;k<3;k++){g.lab[k]+=p.lab[k]*p.w;g.rgb[k]+=p.rgb[k]*p.w;}}
    groups=groups.filter(g=>g.w>0);groups.forEach(g=>{for(let k=0;k<3;k++){g.lab[k]/=g.w;g.rgb[k]/=g.w;}});
    C=groups.map(g=>g.lab);
  }
  groups.sort((a,b)=>b.w-a.w);
  const out=[];
  for(const g of groups){const m=out.find(o=>dE(o.lab,g.lab)<10); if(m){m.w+=g.w;} else out.push(g);}
  return out.map(g=>({lab:g.lab,rgb:g.rgb,share:g.w/W,word:colorWord(g.rgb)})).filter((g,i)=>i===0||g.share>=0.04);
}

/* ---------- 色盤 → 寶可夢 ---------- */
function scoreMon(pal,mon){
  const top=pal.slice(0,3),tot=top.reduce((a,c)=>a+c.share,0);
  let d=0;
  for(const c of top){ d+=(c.share/tot)*Math.min(...mon.labs.map((l,j)=>dE(c.lab,l)+j*5)); }
  return d+0.35*dE(pal[0].lab,mon.labs[0]);
}
function pickMon(pal){
  const scored=MONS.map(m=>({m,d:scoreMon(pal,m)})).sort((a,b)=>a.d-b.d);
  const cands=scored.slice(0,CFG.candidates||8), dmin=cands[0].d;
  const p0=pal[0].lab, vivid=Math.min(1,Math.hypot(p0[1],p0[2])/70);
  const rar={1:1,2:0.45,3:0.12+0.25*vivid};
  const temp=CFG.randomness??10;                       // 越大越隨機，顏色差一點的也有機會出現
  const ws=cands.map(c=>Math.exp(-(c.d-dmin)/temp)*(rar[c.m.rarity]??1));
  const q=l=>l.map(v=>Math.round(v/12)).join(",");
  // 預設每次都用時間當亂數種子：同一張照片也會遇到不同寶可夢；sameResultPerDay=true 則同色同天結果固定
  const seed=CFG.sameResultPerDay ? pal.slice(0,2).map(c=>q(c.lab)).join("|")+"|"+today() : `${Date.now()}|${Math.random()}`;
  const r=rng(fnv1a(seed))();
  let acc=0,tot=ws.reduce((a,b)=>a+b,0),pick=cands[0];
  for(let i=0;i<cands.length;i++){acc+=ws[i]/tot;if(r<acc){pick=cands[i];break;}}
  return {mon:pick.m, sim:Math.max(5,Math.min(99,Math.round(100-pick.d*1.4)))};
}

/* ---------- 載入資料 ---------- */
async function loadData(){
  const get=async p=>{const r=await fetch(DATA_BASE+p,{cache:"no-cache"});if(!r.ok)throw new Error(p+" "+r.status);return r.json();};
  CFG=await get("config.json");
  TYPES=await get("types.json");
  const packs=await Promise.all(CFG.packs.map(get));
  const seen=new Map();
  for(const pack of packs) for(const m of pack.pokemon){
    if(!TYPES[m.type]||!m.colors?.length){console.warn("略過格式不正確的寶可夢",m);continue;}
    seen.set(m.id,{...m,labs:m.colors.map(hexLab)});   // 後面的資料包可以覆蓋前面同編號的寶可夢
  }
  MONS=[...seen.values()];
}

/* ---------- 1 拍照 ---------- */
let stream=null,camWanted=false,liveTimer=0;
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia||!isSecureContext){
    $("camMsg").textContent="這裡不能直接開相機（需要 https）。請用下面的按鈕拍照。";$("liveBtn").hidden=true;return;
  }
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1280}},audio:false});
    const v=$("video");v.srcObject=stream;v.hidden=false;await v.play();
    camWanted=true;
    $("camOff").hidden=true;$("reticle").hidden=false;$("liveChip").hidden=false;$("shutter").hidden=false;
    clearInterval(liveTimer);liveTimer=setInterval(liveScan,450);
  }catch(err){
    $("camMsg").textContent="相機打不開（可能沒有給權限）。請用下面的按鈕拍照。";
  }
}
function pauseCamera(){
  clearInterval(liveTimer);
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $("video").hidden=true;$("reticle").hidden=true;$("liveChip").hidden=true;$("shutter").hidden=true;$("camOff").hidden=false;
}
function resumeCamera(){ if(camWanted&&!stream) startCamera(); }
function liveScan(){
  const v=$("video");if(!v.videoWidth)return;
  const pal=palette(v,v.videoWidth,v.videoHeight);
  $("liveDot").style.background=css(pal[0].rgb);
  $("liveText").textContent=`看到${pal[0].word}${pal[1]?"、"+pal[1].word:""}`;
}
$("liveBtn").onclick=startCamera;
$("shutter").onclick=()=>{
  const v=$("video");if(!v.videoWidth)return;
  const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;c.getContext("2d").drawImage(v,0,0);
  startScan(c.toDataURL("image/jpeg",0.85));
};
$("photo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;startScan(URL.createObjectURL(f));e.target.value="";});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>startScan(sample(b.dataset.s)));

/* ---------- 2 分析顏色 ---------- */
let scanning=false;
function startScan(src){
  if(!MONS.length){toast("寶可夢資料還沒載入");return;}
  const img=new Image();
  img.onload=async()=>{
    scanning=true;
    const pal=palette(img,img.naturalWidth,img.naturalHeight);
    const picked=pickMon(pal);                                  // 先決定是誰，趁分析動畫時下載圖片
    const preload=new Promise(res=>{const im=new Image();im.onload=im.onerror=res;im.src=artUrl(picked.mon.id);});
    $("scanImg").src=src;$("sceneBg").style.backgroundImage=`url("${src}")`;
    $("scanText").textContent="分析顏色中…";
    $("palette").innerHTML=pal.map(c=>`<i style="background:${css(c.rgb)}"></i>`).join("");
    $("palLegend").innerHTML="";
    go("scan");
    await wait(450);
    [...$("palette").children].forEach((el,i)=>el.style.flex=pal[i].share);
    $("palLegend").innerHTML=pal.map(c=>`<span style="--c:${css(c.rgb)}">${c.word} ${Math.round(c.share*100)}%</span>`).join("");
    const words=pal.slice(0,2).map(c=>c.word).filter((w,i,a)=>a.indexOf(w)===i);
    await wait(600); $("scanText").textContent=`看到${words.join(" + ")}！`;
    await wait(900); $("scanText").textContent="草叢裡有東西在動…";
    await Promise.race([preload,wait(800)]);
    scanning=false;
    startEncounter(pal,picked);
  };
  img.onerror=()=>toast("這張照片打不開，換一張試試");
  img.src=src;
}

/* ---------- 3 遭遇 ---------- */
let current=null,fled=false,ballsLeft=0,busy=false,lastCaught=null;
function setMonVisual(mon,{imgEl,fbEl,glyphEl}){
  const T=TYPES[mon.type], st=document.documentElement.style;
  st.setProperty("--type",T.color);st.setProperty("--main",mon.colors[0]);st.setProperty("--accent",mon.colors[1]||mon.colors[0]);

}
async function startEncounter(pal,picked){

let ballArtOk=false;
function drawOrbs(){const n=CFG.ballsPerEncounter||3;$("orbs").innerHTML=Array.from({length:n},(_,i)=>{const u=i<n-ballsLeft?"used":"";return ballArtOk?`<img class="${u}" src="${CFG.ballUrl}" alt="">`:`<b class="${u}"></b>`;}).join("");}
function bubble(t){$("bubble").textContent=t;}

/* ---------- 動畫小工具 ---------- */
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const T_=ms=>reduced?Math.round(ms*0.35):ms;
const wait=ms=>new Promise(r=>setTimeout(r,T_(ms)));
function anim(el,frames,opt){const a=el.animate(frames,{fill:"forwards",...opt,duration:T_(opt.duration)});return a.finished.catch(()=>{});}
function pts(){
  const s=$("scene").getBoundingClientRect(), m=$("mon").getBoundingClientRect();
  const mon={x:m.left-s.left+m.width/2,y:m.top-s.top+m.height/2};
  return {hand:{x:s.width/2,y:s.height-42},mon,ground:{x:mon.x,y:s.height*0.76}};
}
const at=(p,extra="")=>`translate(${p.x}px,${p.y}px) ${extra}`;
function stars(p,n=10){
  const fx=$("fx");
  for(let i=0;i<n;i++){
    const s=document.createElement("i"),a=i/n*Math.PI*2,r=70+Math.random()*30;
    fx.appendChild(s);
    anim(s,[{transform:at(p,"scale(.3)"),opacity:1},{transform:at({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r},"scale(1) rotate(90deg)"),opacity:0}],{duration:800,easing:"ease-out"}).then(()=>s.remove());
  }
}
function shakeScene(px=6,ms=350){
  const k=[0,-1,1,-.7,.7,-.3,0].map(f=>({transform:`translate(${f*px}px,${Math.abs(f)*px*.4}px)`}));
  return anim($("scene"),k,{duration:ms,easing:"linear",fill:"none"});
}
function flash(p){const f=$("flash");return anim(f,[{transform:at(p,"scale(.2)"),opacity:1},{transform:at(p,"scale(1.4)"),opacity:0}],{duration:450,easing:"ease-out"});}

/* ---------- 投擲與捕捉 ----------
   onBallThrown → 球飛出、寶可夢被吸進去 → 等 onBallLanded → 落地、晃動、結果
   抓到的機率只看稀有度（config.catchBase），不看丟得好不好                          */
let landedResolve=null;
async function throwBall(){
  if(!current||busy||ballsLeft<=0||screen!=="encounter")return;
  busy=true;ballsLeft--;drawOrbs();$("throwBtn").disabled=true;
  const landed=new Promise(r=>landedResolve=r);
  const mon=current, ball=$("ball"), monEl=$("mon"), sh=$("ballShadow"), P=pts();
  const p=Math.min(0.95,CFG.catchBase[mon.rarity]??0.5);
  const q=Math.cbrt(p);                                       // 每晃一下撐住的機率，三下都撐住就抓到
  let shakes=0; while(shakes<3&&Math.random()<q) shakes++;
  const caught=shakes===3;

  bubble("去吧，寶貝球！");
  // 1. 拋物線飛向寶可夢
  $("hand").hidden=true;ball.hidden=false;ball.classList.remove("locked");
  const top={x:(P.hand.x+P.mon.x)/2,y:Math.min(P.hand.y,P.mon.y)-110};
  await anim(ball,[{transform:at(P.hand,"rotate(0) scale(1.25)")},{transform:at(top,"rotate(400deg) scale(1)"),offset:.55},{transform:at(P.mon,"rotate(760deg) scale(.95)")}],{duration:650,easing:"cubic-bezier(.3,.6,.6,1)"});
  // 2. 打中：球彈開一點、閃光、畫面晃一下，寶可夢變成光被吸進球裡
  flash(P.mon);shakeScene(7,320);
  const up={x:P.mon.x,y:P.mon.y-40};
  anim(ball,[{transform:at(P.mon,"rotate(0)")},{transform:at(up,"rotate(-25deg)")}],{duration:300,easing:"ease-out"});
  await anim(monEl,[{transform:"translate(-50%,-50%) scale(1)",filter:"brightness(1)",opacity:1},{transform:"translate(-50%,-50%) scale(1.05)",filter:"brightness(5)",opacity:1,offset:.35},{transform:`translate(-50%,calc(-50% - 40px)) scale(0)`,filter:"brightness(5)",opacity:0}],{duration:520,easing:"ease-in"});
  anim(ball,[{transform:at(up,"rotate(-25deg)")},{transform:at(up,"rotate(15deg)")},{transform:at(up,"rotate(0)")}],{duration:300});
  // 3. 等寶貝球回報落地（模擬模式會自動送出；最多等 4 秒）
  await Promise.race([landed,wait(CFG.ball?.landTimeoutMs||5000)]);landedResolve=null;
  await anim(ball,[{transform:at(up)},{transform:at(P.ground,"scale(1.1,.9)"),offset:.5,easing:"ease-out"},{transform:at({x:P.ground.x,y:P.ground.y-30},"scale(1)"),offset:.72,easing:"ease-in"},{transform:at(P.ground,"scale(1.08,.92)"),offset:.9},{transform:at(P.ground)}],{duration:700,easing:"ease-in"});
  anim(sh,[{transform:at({x:P.ground.x,y:P.ground.y+24}),opacity:0},{transform:at({x:P.ground.x,y:P.ground.y+24}),opacity:1}],{duration:200});
  shakeScene(5,260);
  // 4. 搖晃
  bubble("……");
  const dots=[...$("shakeDots").children];dots.forEach(d=>d.classList.remove("on"));$("shakeDots").hidden=false;
  await wait(600);
  for(let i=0;i<shakes;i++){
    const deg=30-i*4;
    await anim(ball,[{transform:at(P.ground,"rotate(0)")},{transform:at({x:P.ground.x-5,y:P.ground.y},`rotate(${-deg}deg)`)},{transform:at({x:P.ground.x+4,y:P.ground.y},`rotate(${deg*0.75}deg)`)},{transform:at({x:P.ground.x-2,y:P.ground.y},`rotate(${-deg*0.3}deg)`)},{transform:at(P.ground,"rotate(0)")}],{duration:620,easing:"ease-in-out"});
    shakeScene(2.5,200);sfx("shake");
    dots[i].classList.add("on");
    await wait(i===shakes-1&&caught?700:450);
  }
  if(caught){
    // 5a. 喀擦！抓到了
    ball.classList.add("locked");
    shakeScene(8,420);stars(P.ground,14);sfx("caught");bubble(`喀擦！抓到${mon.name}了！`);
    try{navigator.vibrate&&navigator.vibrate(200);}catch(e){}
    saveDex(mon);lastCaught=mon;current=null;
    await wait(1500);
    anim(sh,[{opacity:1},{opacity:0}],{duration:200});
    showResult(mon);
  }else{
    // 5b. 球彈開，寶可夢跳出來
    await anim(ball,[{transform:at(P.ground,"rotate(0) scale(1)")},{transform:at(P.ground,"rotate(-8deg) scale(1.15,.85)"),offset:.4},{transform:at(P.ground,"rotate(0) scale(1.6)"),opacity:0}],{duration:320});
    ball.hidden=true;ball.getAnimations().forEach(a=>a.cancel());
    anim(sh,[{opacity:1},{opacity:0}],{duration:150});
    flash(P.ground);shakeScene(9,380);sfx("escape");
    const dy=P.ground.y-P.mon.y;
    await anim(monEl,[{transform:`translate(-50%,calc(-50% + ${dy}px)) scale(0)`,filter:"brightness(5)",opacity:0},{transform:"translate(-50%,-62%) scale(1.12)",filter:"brightness(2)",opacity:1,offset:.65},{transform:"translate(-50%,-50%) scale(1)",filter:"brightness(1)",opacity:1}],{duration:520,easing:"ease-out"});
    $("shakeDots").hidden=true;
    if(ballsLeft>0){
      bubble(shakes===0?`${mon.name}一下就跳出來了！`:shakes===1?"啊！差一點點…":"可惜！只差一點！");
      $("hand").hidden=false;
      $("throwBtn").disabled=false;
    }else{
      // 6. 球用完：寶可夢逃走
      bubble(`${mon.name}看起來想逃走…`);
      await wait(900);
      await anim(monEl,[{transform:"translate(-50%,-50%)",opacity:1},{transform:"translate(-50%,-65%)",opacity:1,offset:.25},{transform:"translate(-50%,-50%)",opacity:1,offset:.45},{transform:"translate(-50%,-160%) scale(.6)",opacity:0}],{duration:900,easing:"ease-in"});
      bubble(`${mon.name}逃走了…`);sfx("flee");
      current=null;fled=true;
      $("throwArea").hidden=true;$("fledBtn").hidden=false;
    }
  }
  busy=false;
}

/* ---------- 範例照片 ---------- */
function sample(kind){
  const c=document.createElement("canvas");c.width=c.height=240;const g=c.getContext("2d");
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const grad=st=>{const l=g.createLinearGradient(0,0,0,240);st.forEach((s,i)=>l.addColorStop(i/(st.length-1),s));g.fillStyle=l;g.fillRect(0,0,240,240);};
  const blobs=(n,col,r)=>{for(let i=0;i<n;i++){g.fillStyle=col;g.beginPath();g.arc(rnd()*240,rnd()*240,r*(0.5+rnd()),0,7);g.fill();}};
  if(kind==="grass"){grad(["#7DC95E","#3E9A37","#2C7A2A"]);blobs(18,"#F5E14A",4);}
  if(kind==="sky"){grad(["#3D8BE8","#6FB0F2","#A9D3FA"]);blobs(7,"rgba(255,255,255,.95)",24);}
  if(kind==="sunset"){grad(["#7A3E9D","#E2534A","#F79B3A"]);g.fillStyle="#FFD45A";g.beginPath();g.arc(120,170,38,0,7);g.fill();}
  if(kind==="banana"){grad(["#FBE7A1","#F2D36B"]);g.fillStyle="#F7C81E";g.beginPath();g.ellipse(120,120,95,45,-0.5,0,7);g.fill();}
  if(kind==="night"){grad(["#05070F","#121a33","#1d2440"]);blobs(30,"#F4F4F4",1.2);}
  return c.toDataURL();
}

let toastT;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2400);}

/* =========================================================
   真球模式：後鏡頭拍地板，追蹤「記住顏色的球」
   球飛進畫面（消失一陣子後出現且在移動）→ onBallThrown
   球停下來，或飛出畫面一陣子                → onBallLanded
   ========================================================= */
class BallTracker{
  constructor(o={}){
    this.o={tolerance:22,minPixels:6,absentMs:400,appearWindowMs:450,moveSpeed:0.5,stillSpeed:0.12,stillMs:450,lostMs:1500,maxFlightMs:5000,...o};
    this.color=null;this.reset();
  }
  reset(){this.state="idle";this.last=null;this.lastSeenT=-1e9;this.appearT=null;this.stillSince=null;this.lostSince=null;this.flyStart=0;}
  /* labs：W×H 個 [L,a,b]；回傳 {blob, event} ，blob 的 x,y 是 0~1 */
  update(t,labs,W,H){
    const o=this.o; let blob=null, event=null;
    if(this.color){
      const mask=new Uint8Array(W*H);
      for(let i=0;i<W*H;i++) if(dE(labs[i],this.color)<o.tolerance) mask[i]=1;
      blob=largestBlob(mask,W,H);
      if(blob&&blob.n<o.minPixels) blob=null;
    }
    const speed=(blob&&this.last)?Math.hypot(blob.x-this.last.x,blob.y-this.last.y)/Math.max(0.016,(t-this.last.t)/1000):0;
    if(this.state==="idle"){
      if(blob){
        if(t-this.lastSeenT>=o.absentMs) this.appearT=t;            // 消失一陣子後又出現
        if(this.appearT!==null&&t-this.appearT<=o.appearWindowMs&&speed>o.moveSpeed){
          this.state="flying";this.flyStart=t;this.stillSince=null;this.lostSince=null;this.appearT=null;event="thrown";
        }
      }
    }else{
      if(blob){
        this.lostSince=null;
        if(speed<o.stillSpeed){ this.stillSince??=t; if(t-this.stillSince>=o.stillMs) event="landed"; }
        else this.stillSince=null;
      }else{
        this.lostSince??=t; if(t-this.lostSince>=o.lostMs) event="landed";
      }
      if(t-this.flyStart>o.maxFlightMs) event="landed";
      if(event==="landed"){this.state="idle";this.appearT=null;}
    }
    if(blob){this.lastSeenT=t;this.last={x:blob.x,y:blob.y,t};} else this.last=null;
    return {blob,event,speed};
  }
}
function largestBlob(mask,W,H){
  const seen=new Uint8Array(W*H),stack=[];let best=null;
  for(let i=0;i<W*H;i++){
    if(!mask[i]||seen[i])continue;
    let n=0,sx=0,sy=0;stack.push(i);seen[i]=1;
    while(stack.length){
      const k=stack.pop(),x=k%W,y=(k/W)|0;n++;sx+=x;sy+=y;
      for(const nb of [x>0?k-1:-1,x<W-1?k+1:-1,y>0?k-W:-1,y<H-1?k+W:-1]) if(nb>=0&&mask[nb]&&!seen[nb]){seen[nb]=1;stack.push(nb);}
    }
    if(!best||n>best.n) best={n,x:(sx/n+.5)/W,y:(sy/n+.5)/H,r:Math.sqrt(n/Math.PI)/W};
  }
  return best;
}

const AR={on:false,stream:null,raf:0,lastT:0,tracker:null,throwActive:false,W:96,H:72,cv:null};
const BALL_COLOR_KEY="colormon-ball-color", BALL_MODE_KEY="colormon-ball-mode";
function arConfig(){return CFG?.ball||{};}
function arArmed(){return screen==="encounter"&&current&&!busy&&ballsLeft>0&&!$("throwBtn").disabled;}
async function startAR(){
  if(AR.stream) return;
  if(!navigator.mediaDevices?.getUserMedia||!isSecureContext){toast("這裡不能開相機（需要 https）");setBallMode(false);return;}
  try{
    AR.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:640}},audio:false});
  }catch(e){toast("相機打不開，請確認有給相機權限");setBallMode(false);return;}
  const v=$("arVideo");v.srcObject=AR.stream;v.hidden=false;try{await v.play();}catch(e){}
  $("scene").classList.add("ar");$("arChip").hidden=false;
  AR.tracker??=new BallTracker(arConfig());
  try{const c=JSON.parse(localStorage.getItem(BALL_COLOR_KEY));if(c)AR.tracker.color=c;}catch(e){}
  $("calib").hidden=!!AR.tracker.color;
  AR.cv??=Object.assign(document.createElement("canvas"),{width:AR.W,height:AR.H});
  cancelAnimationFrame(AR.raf);AR.raf=requestAnimationFrame(arLoop);
}
function stopAR(){
  cancelAnimationFrame(AR.raf);
  if(AR.stream){AR.stream.getTracks().forEach(t=>t.stop());AR.stream=null;}
  $("arVideo").hidden=true;$("scene").classList.remove("ar");$("arChip").hidden=true;$("ballMark").hidden=true;$("calib").hidden=true;
  if(AR.tracker)AR.tracker.reset();AR.throwActive=false;
}
function arFrameLabs(){
  const v=$("arVideo"),W=AR.W,H=AR.H,ctx=AR.cv.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(v,0,0,W,H);
  const px=ctx.getImageData(0,0,W,H).data,labs=new Array(W*H);
  for(let i=0;i<W*H;i++) labs[i]=rgbLab(px[i*4],px[i*4+1],px[i*4+2]);
  return labs;
}
/* 影片座標(0~1) → 場景座標（影片是 object-fit:cover） */
function videoToScene(nx,ny){
  const v=$("arVideo"),s=$("scene").getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight;
  const k=Math.max(s.width/vw,s.height/vh),dw=vw*k,dh=vh*k;
  return {x:nx*dw-(dw-s.width)/2,y:ny*dh-(dh-s.height)/2};
}
function arLoop(t){
  AR.raf=requestAnimationFrame(arLoop);
  const v=$("arVideo");
  if(!v.videoWidth||t-AR.lastT<66)return;      // 約 15 FPS
  AR.lastT=t;
  const tr=AR.tracker,chip=$("arChip");
  if(!tr.color){chip.textContent="先讓鏡頭記住球的顏色";return;}
  const {blob,event}=tr.update(t,arFrameLabs(),AR.W,AR.H);
  const mark=$("ballMark");
  if(blob&&arConfig().showMarker!==false){
    const p=videoToScene(blob.x,blob.y),d=Math.max(28,blob.r*2*$("scene").clientWidth*1.3);
    mark.hidden=false;mark.style.width=mark.style.height=d+"px";mark.style.margin=`${-d/2}px 0 0 ${-d/2}px`;mark.style.transform=`translate(${p.x}px,${p.y}px)`;
  }else mark.hidden=true;
  if(event==="thrown"&&arArmed()){AR.throwActive=true;sfx("throw");window.onBallThrown();}
  else if(event==="landed"&&AR.throwActive){AR.throwActive=false;window.onBallLanded();}
  chip.textContent=tr.state==="flying"?"球飛進來了！":arArmed()?(blob?"先把球撿起來，再丟進畫面":"把球丟進畫面裡！"):"等一下…";
}
$("calibBtn").onclick=()=>{
  const v=$("arVideo");if(!v.videoWidth)return;
  const s=Math.min(v.videoWidth,v.videoHeight)*0.3,c=document.createElement("canvas");c.width=c.height=48;
  c.getContext("2d").drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,48,48);
  const pal=palette(c,48,48),lab=pal[0].lab;
  AR.tracker.color=lab;AR.tracker.reset();
  try{localStorage.setItem(BALL_COLOR_KEY,JSON.stringify(lab));}catch(e){}
  $("calib").hidden=true;
  const chroma=Math.hypot(lab[1],lab[2]);
  toast(chroma<18?`記住了（${pal[0].word}）。這顆球顏色比較淡，換顆鮮豔的球會更準`:`記住了！這是一顆${pal[0].word}的球`);
};
$("recalBtn").onclick=()=>{ if(AR.tracker){AR.tracker.color=null;} $("calib").hidden=false; };
function setBallMode(on){

  if(on&&screen==="encounter") startAR(); else stopAR();
}
$("motionBtn").onclick=()=>setBallMode(!AR.on);
try{AR.on=localStorage.getItem(BALL_MODE_KEY)==="1";}catch(e){}

/* ---------- 音效（手機立在支架上感覺不到震動） ---------- */
let audioCtx=null;
addEventListener("pointerdown",()=>{try{audioCtx??=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();}catch(e){}},{passive:true});
function sfx(name){
  if(!audioCtx)return;
  const seq={appear:[[660,.09],[880,.09],[990,.16]],throw:[[700,.05],[500,.05],[350,.08]],shake:[[300,.05]],caught:[[523,.1],[659,.1],[784,.1],[1046,.25]],escape:[[440,.1],[300,.18]],flee:[[400,.12],[300,.12],[200,.25]]}[name];
  if(!seq)return;
  let t=audioCtx.currentTime;
  for(const [f,d] of seq){
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+d);t+=d;
  }
}
