name: Check data and page

# 遊戲部署在 Vercel（push 到 main 會自動部署）；這裡只做檢查。
# 舊的 GitHub Pages 網址保留最後部署的 v0.15，只用來提示搬家。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Pokémon data packs
        run: node tools/validate-data.mjs
      - name: Evolution tree tests
        run: node tools/test-evolutions.mjs
      - name: CHANGELOG.md matches changelog.json
        run: |
          python3 tools/build-changelog.py
          git diff --exit-code CHANGELOG.md || (echo "請執行 python3 tools/build-changelog.py 再 commit" && exit 1)
      - name: Check page script syntax
        run: |
          node -e "const s=require('fs').readFileSync('site/index.html','utf8');
          const js=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]).join('\n');
          new Function(js); console.log('script OK');"
